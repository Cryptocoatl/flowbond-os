<style>

    --salvia:#7E9078; --salvia-tenue:#E5EAE0; --pizarra:#4C6072; --tinta:#2C2722;

    --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --r:14px;
    --ok:#3f7d59; --warn:#b5762a; --bad:#a4493e;

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--tinta);background:var(--lino);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
  a{color:var(--pizarra)}
  button{font-family:var(--sans);cursor:pointer}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:14px;padding:9px 16px;border-radius:100px;border:1px solid transparent;transition:.2s}
  .btn-primary{background:var(--tinta);color:var(--lino)}
  .btn-primary:hover{background:var(--oro)}
  .btn-ghost{background:transparent;color:var(--tinta);border:1px solid var(--linea)}
  .btn-ghost:hover{border-color:var(--tinta)}
  .btn-sm{padding:6px 12px;font-size:13px}
  input,select,textarea{font-family:var(--sans);font-size:14px;color:var(--tinta);background:var(--pergamino);
    border:1px solid var(--linea);border-radius:10px;padding:10px 12px;width:100%}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-size:12px;font-weight:600;color:var(--tinta-60);margin:0 0 5px}

  .login-card{background:var(--pergamino);border:1px solid var(--linea);border-radius:22px;padding:40px;max-width:420px;width:100%;text-align:center}

  .nav{position:sticky;top:62px;flex:none;width:210px;padding:22px 14px;height:calc(100vh - 62px);overflow:auto}

/* ============ AUTH ============ */
// Primary path: email + password, no email round-trip, no hub. Instant.
async function loginPassword(e){
  e.preventDefault();
  const email=$("loginEmail").value.trim(), password=$("loginPasswordInput").value;
  $("loginMsg").style.color="";
  $("loginMsg").textContent="Entrando…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $("loginMsg").style.color="var(--bad)"; $("loginMsg").textContent="Error: "+error.message; return; }
  $("loginMsg").textContent="";
  await boot();
}
// Fallback: same-origin magic-link (no FBID hub). Lands back here on /admin.
async function sendLink(e){
  e.preventDefault();
  const email=$("loginEmail").value.trim();
  $("loginMsg").textContent="Enviando…";
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + "/admin" } });
  $("loginMsg").style.color = error ? "var(--bad)" : "var(--ok)";
  $("loginMsg").textContent = error ? ("Error: "+error.message) : "Revisa tu correo y abre el enlace de acceso.";
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

// Redeem whatever the email-link auth flow left in the URL, then clean it up.
// Shapes handled: ?code= (PKCE email link), #access_token=… (implicit —
// auto-detected by supabase-js), #error=… (expired/used link).
async function consumeAuthFromUrl(){
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const errDesc = q.get("error_description") || h.get("error_description") || q.get("error") || h.get("error");
  const code = q.get("code");
  const clean = () => history.replaceState({}, "", location.origin + "/admin");

  if(errDesc){ clean(); return { error: decodeURIComponent(errDesc.replace(/\+/g," ")) }; }
  try{
    if(code){ const { error } = await sb.auth.exchangeCodeForSession(code); clean(); if(error) return { error: error.message }; }
    else if(location.hash.includes("access_token")){ clean(); } // supabase-js detectSessionInUrl already stored it
  }catch(e){ clean(); return { error: e.message }; }
  return {};
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("login").style.display="flex"; $("app").style.display="none"; return; }
  // ensure member row then check role
  let role="visitor";
  try{ const { data } = await sb.rpc("vpa_ensure_member",{ p_locale:"es" }); role=data||"visitor"; }
  catch(_){ try{ const { data } = await sb.rpc("vpa_my_role"); role=data||"visitor"; }catch(__){} }
  if(role!=="super_admin"){
    $("login").style.display="flex";
    $("login").innerHTML='<div class="login-card"><h1>Acceso restringido</h1><p>Tu cuenta ('+esc(session.user.email)+') no tiene permisos de administración. Pide a un super admin que te otorgue acceso.</p><button class="btn btn-ghost" onclick="logout()">Salir</button></div>';
    return;
  }
  $("login").style.display="none"; $("app").style.display="block";
  $("whoami").textContent = session.user.email;
  buildNav();
  await preload();
  go("guia");
}

}

function labelOf(sec){ return (SECTIONS.find(s=>s[0]===sec)||["",sec])[1]; }
function hintOf(sec){ return ({
  specialists:"Crea y edita las voces del directorio. Solo los 'published' se ven en el sitio. El correo/teléfono son privados y se revelan a quien inicia sesión.",
  offerings:"Lo que ofrece cada voz: libros, ebooks, audiolibros, coaching, sesiones, retiros, conferencias. Con enlace externo (Amazon etc.) o venta vía Voces. Solo los 'published' se ven en el perfil público.",

  workshops:"Talleres y retiros. Define fecha, modalidad, precio y especialista.",
  products:"Tienda de contenidos digitales (ebooks, audios, cursos, guías).",
  testimonials:"Historias de personas que se transformaron.",
}[sec]||""); }
function imgUrl(n){ return !n?"":(String(n).startsWith("http")?n:`https://images.unsplash.com/${n}?auto=format&fit=crop&w=120&q=60`); }

/* ---- acciones por especialista (comentar, reclamar, compartir, borrar) ---- */
function specActions(i){
  const claimed = i.fbid_user ? `<span class="pill verified" title="perfil reclamado">✓ cuenta</span>` : "";
  return `${claimed}
    <button class="btn btn-ghost btn-sm" onclick='specComment("${i.id}","${escAttr(i.name)}")'>Comentar</button>
    <button class="btn btn-ghost btn-sm" onclick='specDeal("${i.id}","${escAttr(i.name)}")'>Acuerdo %</button>
    <button class="btn btn-ghost btn-sm" onclick='specClaim("${i.id}","${escAttr(i.name)}",${i.fbid_user?1:0})'>Enlace de reclamo</button>
    <button class="btn btn-ghost btn-sm" onclick='specPhoto("${i.id}","${escAttr(i.name)}")'>Subir/editar foto</button>
    <button class="btn btn-ghost btn-sm" onclick='specShare("${escAttr(i.slug||i.id)}")'>Compartir</button>
    <button class="btn btn-ghost btn-sm" style="color:var(--bad)" onclick='specDelete("${i.id}","${escAttr(i.name)}")'>Borrar</button>`;
}
async function specComment(id,name){
  const msg=prompt("Comentario para "+name+" (le llega como notificación en su panel; si aún no reclama su perfil, se le envía por correo):");
  if(!msg||!msg.trim()) return;
  try{ const {error}=await sb.rpc("vpa_open_change",{payload:{specialist_id:id,kind:"comment",message:msg.trim()}}); if(error)throw error;
    toast("Comentario enviado ✓"); }catch(e){ toast("Error: "+e.message); }
}
async function specClaim(id,name,claimed){
  if(claimed && !confirm(name+" ya reclamó su perfil. ¿Generar un enlace nuevo de todos modos? (invalida el anterior)")) return;
  try{
    const { data, error } = await sb.rpc("vpa_create_claim",{ p_specialist_id:id }); if(error)throw error;
    const url = location.origin + "/mi-voz?claim=" + data;
    await navigator.clipboard.writeText(url).catch(()=>{});
    prompt("Enlace de reclamo para "+name+" — cópialo y compártelo (copiado al portapapeles):", url);
    toast("Enlace de reclamo generado ✓");
  }catch(e){ toast("Error: "+e.message); }
}
// Subir un archivo desde el formulario (foto/portada/audio) → sube a storage y guarda la URL en el campo oculto
// Solo se bloquean ejecutables/scripts; cualquier otro documento (pdf, html, doc, epub, mobi, zip…) se permite
const BAD_EXT=["exe","bat","cmd","com","scr","msi","app","dll","js","mjs","jar","sh","bash","bin","apk","deb","dmg","pkg","svg","vbs","ps1","wsf","cpl","gadget","jse","msc"];
async function pickFormFile(key, accept, media){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept;
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    if(media==="image"){ if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ toast("Este campo es solo para IMÁGENES. Para un PDF/HTML/Word usa el campo '📄 Archivo descargable'."); return; } }
    else if(media==="audio"){ if(!/^audio\//.test(f.type)){ toast("Este campo es solo para AUDIO. Para un PDF/HTML/Word usa '📄 Archivo descargable'."); return; } }
    else { if(BAD_EXT.includes(ext)){ toast("Por seguridad no se permite ese tipo de archivo (ejecutable/script)."); return; } }
    const maxMB = media==="image"?10:60;
    if(f.size>maxMB*1024*1024){ toast("Archivo muy grande (máx "+maxMB+" MB)"); return; }

// diff del payload vs. el item original (para proponer sólo lo que cambió)
function diffPayload(payload, orig){
  const changes={};
  Object.keys(payload).forEach(k=>{
    if(k==="id") return;
    const a=payload[k], b=orig?orig[k]:undefined;
    const na=Array.isArray(a)?JSON.stringify(a):(a==null?"":String(a));
    const nb=Array.isArray(b)?JSON.stringify(b):(b==null?"":String(b));
    if(na!==nb) changes[k]=a;
  });
  return changes;
}
async function saveAsSuggestion(){
  const sec=current.entity; if(sec!=="specialists"&&sec!=="offerings"){ return; }
  const payload=collect(); const changes=diffPayload(payload, current.item);
  delete changes.status; delete changes.specialist_id;
  if(!Object.keys(changes).length){ toast("No hay cambios para proponer"); return; }
  const msg=prompt("Mensaje para la voz sobre esta sugerencia (opcional):")||"";
  const p = sec==="specialists"
    ? { specialist_id:current.item.id, kind:"suggestion", changes, message:msg }
    : { offering_id:current.item.id, specialist_id:current.item.specialist_id, kind:"suggestion", changes, message:msg };
  const btn=$("suggestBtn"); btn.disabled=true;
  try{ const {error}=await sb.rpc("vpa_open_change",{payload:p}); if(error)throw error;
    toast("Sugerencia enviada a la voz ✓"); closeDrawer(); }
  catch(e){ toast("Error: "+e.message); }
  finally{ btn.disabled=false; }
}
// Un campo puede vivir dentro de un jsonb (fd.json), p. ej. contact_socials.linkedin
function fieldVal(item,fd){
  if(!item) return undefined;
  if(fd.json){ const o=item[fd.json]; return (o&&typeof o==="object")?o[fd.k]:undefined; }
  return item[fd.k];
}
function fieldHtml(fd,val){
  const id="f_"+fd.k; const bi=fd.bi?`<span class="bi">${fd.bi}</span> `:"";
  let inner="";
  if(fd.t==="textarea") inner=`<textarea id="${id}">${esc(val||"")}</textarea>`;
  else if(fd.t==="number") inner=`<input id="${id}" type="number" value="${val!=null?esc(val):""}">`;
  else if(fd.t==="datetime") inner=`<input id="${id}" type="datetime-local" value="${toLocalInput(val)}">`;
  else if(fd.t==="select") inner=`<select id="${id}">${fd.opts.map(o=>`<option value="${esc(o[0])}" ${String(val)===String(o[0])?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
  else if(fd.t==="chk") return `<div class="field"><label class="chk"><input id="${id}" type="checkbox" ${val?"checked":""}> ${esc(fd.l)}</label></div>`;
  else if(fd.t==="chkgroup"){
    const arr=Array.isArray(val)?val:[];
    return `<div class="field"><label>${esc(fd.l)}</label><div class="chkgroup">${fd.opts.map(o=>`<label class="chk"><input type="checkbox" data-grp="${fd.k}" value="${o[0]}" ${arr.includes(o[0])?"checked":""}> ${esc(o[1])}</label>`).join("")}</div></div>`;
  }
  else if(fd.t==="icon"){
    const cur = val!=null ? String(val) : "";
    const known = CAT_ICONS.some(o=>o[1]===cur);
    const cell = (label,svg)=>`<button type="button" class="ico-opt${svg===cur?" sel":""}" title="${esc(label)}"
        onclick="pickIcon('${fd.k}',this)" data-svg="${esc(svg)}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${svg}</svg></button>`;
    return `<div class="field"><label>${bi}${esc(fd.l)}</label>
      <div class="ico-grid">${CAT_ICONS.map(o=>cell(o[0],o[1])).join("")}</div>
      ${cur && !known ? `<div style="font-size:12px;color:#8a8378;margin-top:6px">Esta temática usa un ícono propio; se conserva si no eliges otro.</div>` : ""}
      <input type="hidden" id="${id}" value="${esc(cur)}">
      ${fd.hint?`<div style="font-size:12px;color:#8a8378;margin-top:5px;line-height:1.45">${fd.hint}</div>`:""}</div>`;
  }
  else if(fd.t==="upload"){
    const media=fd.media||"image"; const cur=val!=null?String(val):"";
    const accept = media==="audio" ? "audio/*"
                 : media==="file"  ? ""
                 : "image/jpeg,image/png,image/webp";
    const prev = media==="audio"
      ? `<div id="${id}_prev" style="flex:1;min-width:180px">${cur?`<audio controls src="${esc(cur)}" style="width:100%"></audio>`:`<span style="color:#a49a88;font-size:13px">Sin audio</span>`}</div>`
      : media==="file"
      ? `<div id="${id}_prev" style="flex:1;min-width:180px">${cur?`<a href="${esc(cur)}" target="_blank" rel="noopener">📄 Ver archivo actual</a>`:`<span style="color:#a49a88;font-size:13px">Sin archivo</span>`}</div>`
      : `<div id="${id}_prev" style="width:120px;height:120px;border-radius:50%;background:#efe8db center/cover no-repeat;border:1px solid var(--linea);flex:none;${cur?`background-image:url('${esc(cur)}')`:""}"></div>`;
    return `<div class="field"><label>${bi}${esc(fd.l)}</label>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${prev}
        <div><button type="button" class="btn btn-ghost btn-sm" onclick="pickFormFile('${fd.k}','${accept}','${media}')">📎 Subir archivo</button>
        <input type="hidden" id="${id}" value="${esc(cur)}"></div></div></div>`;
  }
  else { // text, arr
    const v=fd.arr&&Array.isArray(val)?val.join(", "):(val!=null?val:"");
    inner=`<input id="${id}" type="text" value="${esc(v)}"${fd.dis?' disabled style="background:#efeae1;color:#a49a88;cursor:not-allowed"':''}>`;
  }
  const hint=fd.hint?`<div style="font-size:12px;color:#8a8378;margin-top:5px;line-height:1.45">${fd.hint}</div>`:"";
  return `<div class="field"><label>${bi}${esc(fd.l)}${fd.req?" *":""}</label>${inner}${hint}</div>`;
}
function pickIcon(key,btn){
  const grid=btn.parentElement;
  grid.querySelectorAll(".ico-opt").forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");
  $("f_"+key).value = btn.dataset.svg;
}
function collect(){
  const cfg=current.cfg; const p={}; const bags={};
  if(current.item&&current.item.id) p.id=current.item.id;
  cfg.fields().forEach(fd=>{
    // Campos que viven dentro de un jsonb: se parte del valor actual para no
    // borrar las redes que el formulario no muestra.
    if(fd.json){
      const el=$("f_"+fd.k); if(!el) return;
      if(!bags[fd.json]) bags[fd.json]=Object.assign({}, (current.item&&current.item[fd.json])||{});
      const v=el.value.trim();
      if(v) bags[fd.json][fd.k]=v; else delete bags[fd.json][fd.k];
      return;
    }
    if(fd.t==="chk"){ p[fd.k]=$("f_"+fd.k).checked; return; }
    if(fd.t==="chkgroup"){ p[fd.k]=[...document.querySelectorAll(`[data-grp="${fd.k}"]:checked`)].map(e=>e.value); return; }
    if(fd.t==="upload"){ const el=$("f_"+fd.k); p[fd.k]= el?el.value.trim():""; return; }
    const el=$("f_"+fd.k); if(!el) return; let v=el.value;
    if(fd.t==="datetime"){ p[fd.k]= v? new Date(v).toISOString() : ""; return; }
    if(fd.arr){ p[fd.k]= v.split(",").map(x=>x.trim()).filter(Boolean); return; }
    if(fd.t==="number"){ p[fd.k]= v===""?null:Number(v); return; }
    p[fd.k]=v;
  });
  Object.keys(bags).forEach(k=>{ p[k]=bags[k]; });
  // price_mxn -> price_cents (null se conserva: ofertas "a convenir")
  if("price_mxn" in p){ p.price_cents = p.price_mxn==null ? null : Math.round((Number(p.price_mxn)||0)*100); delete p.price_mxn; }
  return p;
}
// Traduce el error crudo de la base a algo que se entienda sin ser programador.
function saveErrorText(msg){
  msg = msg || "";
  if(/booking_required/.test(msg))
    return "Falta el enlace de agenda (Calendly): las sesiones individuales y grupales no se pueden publicar sin él.";
  if(/category_name_required/.test(msg))
    return "Falta el nombre de la temática.";
  if(/duplicate key|already exists|unique/i.test(msg))
    return "Ya existe otro registro con ese mismo dato único (normalmente el slug). Cámbialo o déjalo vacío para que se genere solo.";
  if(/permission denied|vpa_require|not_allowed/i.test(msg))
    return "Tu sesión no tiene permiso para esto. Cierra sesión y vuelve a entrar.";
  return "No se pudo guardar: " + msg;
}
function showFormError(text){
  const box=$("formError");
  if(!box){ toast(text); return; }
  if(!text){ box.hidden=true; box.textContent=""; return; }
  box.textContent=text; box.hidden=false; box.scrollIntoView({block:"nearest"});
}
async function saveForm(){
  const cfg=current.cfg; const payload=collect();
  showFormError("");
  $("saveBtn").disabled=true; $("saveBtn").textContent="Guardando…";
  try{
    const { error } = await sb.rpc(cfg.rpc,{ payload });
    if(error) throw error;
    toast("Guardado"); closeDrawer(); await preload(); RENDER[current.entity]();
  }catch(e){
    const text = saveErrorText(e && e.message);
    showFormError(text); toast(text);
  }
  finally{ $("saveBtn").disabled=false; $("saveBtn").textContent="Guardar"; }
}
function openDrawer(){ $("drawer").classList.add("open"); $("drawerBg").classList.add("open"); }
function closeDrawer(){ $("drawer").classList.remove("open"); $("drawerBg").classList.remove("open"); }
function toLocalInput(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

async function saveCommission(id){

  try{ const {error}=await sb.rpc("vpa_mp_set_commission",{p_specialist:id,p_commission_pct:Math.round(n)});
    if(error) throw error; toast("Comisión guardada ✓"); RENDER.comisiones();
  }catch(e){ toast("Error: "+e.message); }
}
async function saveDefaultCommission(){

    if(error) throw error; toast("Default actualizado ✓"); RENDER.comisiones();
  }catch(e){ toast("Error: "+e.message); }
}

    <b>${esc(p.name||"—")}</b> · ${pmx(p.amount_cents)} · ${esc(PO_KIND[p.kind]||p.kind)} ·

/* Registrar el método de cobro EN NOMBRE de una voz. Necesario para las voces que
   todavía no tienen cuenta ligada (no pueden entrar a /mi-voz a ponerlo ellas). */
const PO_FIELDS={
  mercadopago:["email"], paypal:["email","holder_name"], wise:["email","holder_name"],
  payoneer:["holder_name","account_number","routing","iban","swift","bank_name","email"],
  dolarapp:["clabe","wallet_address","chain","account_id","email"], usdc:["wallet_address","chain"],
  clabe:["clabe","bank_name","holder_name"],
  bank_intl:["holder_name","iban","account_number","swift","routing","bank_name"], credit:[]};
const PO_FLBL={email:"Correo de la cuenta",holder_name:"Titular",account_id:"Tag / usuario",
  clabe:"CLABE (18 dígitos)",bank_name:"Banco",wallet_address:"Dirección de wallet",chain:"Red",
  iban:"IBAN",account_number:"Número de cuenta",swift:"SWIFT / BIC",routing:"Routing number"};
const PO_CHAINS=["base","polygon","solana","ethereum","arbitrum","optimism","tron"];

function poMethodForm(spec,name,kind){
  kind=kind||"paypal";

  box.innerHTML=`<div class="card" style="margin-top:.5rem">
    <div class="hint">Método de cobro de <b>${esc(name)}</b>. Úsalo sólo si la voz no puede ponerlo ella misma desde su panel — son sus datos bancarios.</div>
    <div class="field"><label>Método</label>
      <select id="pof_kind_${spec}" onchange="poMethodForm('${spec}','${esc(name)}',this.value)">
        ${Object.keys(PO_FIELDS).map(k=>`<option value="${k}" ${k===kind?"selected":""}>${PO_KIND[k]}</option>`).join("")}
      </select></div>
    ${(PO_FIELDS[kind]||[]).map(f=>f==="chain"
      ?`<div class="field"><label>${PO_FLBL[f]}</label><select id="pof_${f}_${spec}">${PO_CHAINS.map(c=>`<option value="${c}">${c.toUpperCase()}</option>`).join("")}</select></div>`
      :`<div class="field"><label>${PO_FLBL[f]}</label><input id="pof_${f}_${spec}"></div>`).join("")}
    <div class="row2">
      <div class="field"><label>País</label><input id="pof_country_${spec}" value="${kind==="payoneer"?"US":"MX"}"></div>
      <div class="field"><label>Moneda</label><input id="pof_currency_${spec}" value="${kind==="payoneer"?"USD":"MXN"}"></div>
    </div>
    ${kind==="usdc"?`<div class="hint" style="color:var(--bad)">⚠️ Verifica la red y la dirección carácter por carácter. Un envío por la red equivocada no se recupera.</div>`:``}
    ${kind==="payoneer"?`<div class="hint">Son los datos de su <b>cuenta receptora</b> de Payoneer (en la app: Recibir → Datos de la cuenta): dólares = número de cuenta + routing · libras = número de cuenta + sort code (va en “Routing number”) · euros = IBAN + BIC. El <b>titular tiene que ir exacto</b> o Payoneer rechaza el depósito. Pon la moneda que corresponda (USD, EUR o GBP). Payoneer no tiene envío automático: tú haces la transferencia y la confirmas aquí.</div>`:``}
    <div class="acts">
      <button class="btn btn-primary" onclick="savePoMethod('${spec}')">Guardar método</button>
      <button class="btn" onclick="document.getElementById('po_form_${spec}').innerHTML=''">Cancelar</button>

async function savePoMethod(spec){
  const kind=$("pof_kind_"+spec).value;
  const p={specialist_id:spec, kind, is_default:true,
    country:($("pof_country_"+spec).value||"MX").trim(),
    currency:($("pof_currency_"+spec).value||"MXN").trim()};
  (PO_FIELDS[kind]||[]).forEach(f=>{ const el=$(`pof_${f}_${spec}`); if(el&&el.value.trim()) p[f]=el.value.trim(); });
  try{ const {error}=await sb.rpc("vpa_save_payout_method",{payload:p}); if(error)throw error;
    toast("Método de cobro guardado ✓"); RENDER.payouts(); }catch(e){ toast("Error: "+e.message); }
}

async function savePayoutCred(which){
  try{
    if(which==="paypal"){
      const id=$("pp_id").value.trim(), sec=$("pp_sec").value.trim(), mode=$("pp_mode").value;
      if(!id||!sec) return toast("Pon el Client ID y el Secret");
      let r=await sb.rpc("vpa_set_payment_secret",{p_provider:"paypal_client_id",p_token:id}); if(r.error)throw r.error;
      r=await sb.rpc("vpa_set_payment_secret",{p_provider:"paypal_secret",p_token:sec}); if(r.error)throw r.error;
      r=await sb.rpc("vpa_set_payment_secret",{p_provider:"paypal_mode",p_token:mode}); if(r.error)throw r.error;
    }else{
      const tok=$("ws_tok").value.trim(), prof=$("ws_prof").value.trim(), mode=$("ws_mode").value;
      if(!tok) return toast("Pon el API token de Wise");
      let r=await sb.rpc("vpa_set_payment_secret",{p_provider:"wise_api_token",p_token:tok}); if(r.error)throw r.error;
      if(prof){ r=await sb.rpc("vpa_set_payment_secret",{p_provider:"wise_profile_id",p_token:prof}); if(r.error)throw r.error; }
      r=await sb.rpc("vpa_set_payment_secret",{p_provider:"wise_mode",p_token:mode}); if(r.error)throw r.error;
    }
    toast("Guardado ✓ — ahora dale «Probar conexión»");
    await testProvider(which);
  }catch(e){ toast("Error: "+e.message); }
}

/* Llama a la API real del proveedor y dice exactamente qué falta. Vale mucho más que
   un "guardado ✓": aquí se descubre si falta el permiso de Payouts o el perfil Business. */
async function payoutTool(body){
  const { data:{ session } } = await sb.auth.getSession();
  const r=await fetch(SUPABASE_URL+"/functions/v1/vpa-payout-tools",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+(session?session.access_token:SUPABASE_ANON)},
    body:JSON.stringify(body)});
  return await r.json();
}
async function testProvider(which){
  const box=$(which==="paypal"?"pp_msg":"ws_msg");
  box.textContent="Consultando al proveedor…";
  try{
    const j=await payoutTool({action: which==="paypal"?"test_paypal":"test_wise"});
    if(j.error) throw new Error(j.error);
    if(!j.ok){ box.innerHTML=`<span style="color:var(--bad)">${esc(j.note||"No se pudo conectar")}</span>`; return; }
    let extra="";
    if(which==="wise"){
      if(j.suggested_profile){ $("ws_prof").value=j.suggested_profile;
        await sb.rpc("vpa_set_payment_secret",{p_provider:"wise_profile_id",p_token:String(j.suggested_profile)});
        extra+=`<br>Perfil detectado y guardado: <b>${esc(String(j.suggested_profile))}</b>`;
      }
      if(j.profiles&&j.profiles.length) extra+=`<br>Perfiles: ${j.profiles.map(p=>`${esc(p.name||"—")} (${esc(p.type)})`).join(" · ")}`;
      extra+= (j.balances&&j.balances.length)
        ? `<br>Saldo disponible: ${j.balances.map(b=>`${Number(b.amount).toLocaleString()} ${esc(b.currency)}`).join(" · ")}`
        : `<br><span style="color:var(--bad)">Sin saldo en Wise — el pago sale de ahí, hay que fondear la cuenta.</span>`;
    }
    if(which==="paypal" && j.can_payout===false) extra+=`<br><span style="color:var(--bad)">Falta activar «Payouts» en la app de PayPal.</span>`;
    box.innerHTML=`<span style="color:${(which==="paypal"&&j.can_payout===false)?"var(--bad)":"var(--ok)"}">${esc(j.note)}</span>${extra}`;
  }catch(e){ box.innerHTML=`<span style="color:var(--bad)">Error: ${esc(e.message)}</span>`; }
}

/* PayPal responde "en proceso" y confirma después: esto pregunta cómo quedó el lote. */
async function syncPaypalPayout(id){
  const box=$("dest_"+id); box.textContent="Consultando a PayPal…";
  try{ const j=await payoutTool({action:"sync_paypal",payout:id});
    box.innerHTML=`<span style="color:${j.status==="failed"?"var(--bad)":"var(--ok)"}">${esc(j.note||"")}</span>`;
    if(j.status==="paid"||j.status==="failed") setTimeout(()=>RENDER.payouts(),1100);
  }catch(e){ box.innerHTML=`<span style="color:var(--bad)">Error: ${esc(e.message)}</span>`; }
}

/* USDC: Mónica envía desde SU wallet (Voces nunca guarda llaves) y aquí se comprueba
   contra la blockchain que el monto correcto llegó a la dirección correcta. */
async function verifyUsdcPayout(id){
  const hash=prompt("Pega el hash de la transacción (0x…):");
  if(!hash) return;
  const box=$("dest_"+id); box.textContent="Verificando en la blockchain…";
  try{ const j=await payoutTool({action:"verify_usdc",payout:id,tx_hash:hash.trim()});
    const link=j.explorer?` <a href="${esc(j.explorer)}" target="_blank" rel="noopener">ver en el explorador ↗</a>`:"";
    box.innerHTML=`<span style="color:${j.ok?"var(--ok)":"var(--bad)"}">${esc(j.note||j.error||"")}</span>${link}`;
    if(j.ok) setTimeout(()=>RENDER.payouts(),1300);
  }catch(e){ box.innerHTML=`<span style="color:var(--bad)">Error: ${esc(e.message)}</span>`; }
}

async function doPayout(spec, ask){
  const msg=$("po_msg_"+spec); let cents=null;
  if(ask){ const v=prompt("¿Cuánto le envías? (en pesos)"); if(!v) return;
    cents=Math.round(parseFloat(v.replace(/[^0-9.]/g,""))*100);
    if(!cents||cents<=0) return toast("Cantidad inválida"); }
  msg.textContent="Preparando el pago…";
  try{
    const { data:pid, error } = await sb.rpc("vpa_create_payout",
      {p_specialist:spec, p_method:null, p_amount_cents:cents, p_notes:null});
    if(error) throw error;
    const { data:{ session } } = await sb.auth.getSession();
    const r=await fetch(SUPABASE_URL+"/functions/v1/vpa-payout",{ method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+(session?session.access_token:SUPABASE_ANON) },
      body:JSON.stringify({ payout:pid }) });
    const j=await r.json();
    if(j.manual){
      msg.innerHTML=`<b>Envíalo tú:</b> ${esc(j.instructions)}<br>Cuando lo hayas mandado, dale <b>✓ Marcar pagado</b> abajo en el historial.`;
    }else if(j.not_configured){
      msg.innerHTML=`${esc(j.note)}`;
    }else if(!j.ok){
      msg.innerHTML=`<span style="color:var(--bad)">No se pudo enviar: ${esc(j.error||"error")}</span> — el saldo volvió a quedar disponible.`;
    }else{
      msg.innerHTML=`Pago enviado ✓ ${j.ref?`(ref ${esc(j.ref)})`:""}`;
    }
    RENDER.payouts();
  }catch(e){ msg.innerHTML=`<span style="color:var(--bad)">Error: ${esc(e.message)}</span>`; }
}

/* --- CLAUDIA: asistente del panel. Consulta sola; para CAMBIAR algo pide confirmación
   (publicar un perfil lo hace público, marcar pagado entrega producto). --- */
let CHAT = [];           // historial visible {role, content}
let PENDING = null;      // acción esperando el sí de Mónica
RENDER.claudia = async () => {
  $("main").innerHTML = `<div class="sec-head"><h2>✨ Pregúntale a ClaudIA</h2></div>
    <div class="hint">Pregúntale lo que quieras de tu plataforma: quién pagó, quién falta por aprobar, si los cobros están bien, qué pasó con una persona. Ella consulta tus datos de verdad — no inventa. <b>Si va a cambiar algo, primero te pregunta.</b></div>
    <div id="chatBox" style="background:#fff;border:1px solid rgba(0,0,0,.10);border-radius:14px;padding:16px;min-height:280px;max-height:52vh;overflow-y:auto"></div>
    <div id="chatPending"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <input id="chatIn" type="text" placeholder="Ej.: ¿quién pagó y falta por aprobar?" style="flex:1;padding:11px 14px;border:1px solid rgba(0,0,0,.15);border-radius:10px;font:inherit"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend();}">
      <button class="btn btn-primary" id="chatBtn" onclick="chatSend()">Enviar</button>
    </div>
    <div class="meta" style="margin-top:8px">Ideas: «¿Diana ya pagó?» · «¿cómo van los cobros?» · «publica a Mario Monroy» · «últimos pedidos»</div>`;
  drawChat();
};
function drawChat(){
  const box = $("chatBox"); if(!box) return;
  if(!CHAT.length){
    box.innerHTML = `<div class="empty">Escríbele abajo. Por ejemplo: <i>«¿quién está esperando que lo apruebe?»</i></div>`;
    return;
  }
  box.innerHTML = CHAT.map(m=>{
    const mine = m.role === "user";
    return `<div style="display:flex;justify-content:${mine?"flex-end":"flex-start"};margin-bottom:10px">
      <div style="max-width:82%;padding:10px 13px;border-radius:13px;font-size:14px;line-height:1.55;white-space:pre-wrap;
        background:${mine?"rgba(126,144,120,.16)":"rgba(182,138,62,.10)"};border:1px solid ${mine?"rgba(126,144,120,.35)":"rgba(182,138,62,.30)"}">
        ${esc(m.content).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
      </div></div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
}
function drawPending(){
  const el = $("chatPending"); if(!el) return;
  if(!PENDING){ el.innerHTML=""; return; }
  el.innerHTML = `<div style="margin-top:12px;padding:13px 15px;border-radius:12px;background:rgba(182,138,62,.12);border:1.5px solid var(--oro)">
    <div style="font-weight:600;margin-bottom:4px">⚠️ ¿Confirmas este cambio?</div>
    <div class="meta" style="margin-bottom:10px">${esc(PENDING.resumen)}</div>
    <button class="btn btn-primary btn-sm" onclick="chatConfirm(true)">Sí, hazlo</button>
    <button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="chatConfirm(false)">No, cancela</button>
  </div>`;
}
async function chatSend(texto, confirmar){
  const input = $("chatIn"), btn = $("chatBtn");
  const msg = texto !== undefined ? texto : (input ? input.value.trim() : "");
  if(!msg && !confirmar) return;
  if(msg){ CHAT.push({role:"user", content:msg}); if(input) input.value=""; }
  PENDING = null; drawPending(); drawChat();
  if(btn){ btn.disabled = true; btn.textContent = "…"; }
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const r = await fetch(SUPABASE_URL+"/functions/v1/vpa-claudia", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":SUPABASE_ANON, "Authorization":"Bearer "+session.access_token },
      body: JSON.stringify({ messages: CHAT, confirm: confirmar || null }),
    });
    const j = await r.json();
    if(!r.ok || j.error){ CHAT.push({role:"assistant", content:"No pude responder: "+(j.note||j.error||"error")}); }
    else {
      CHAT.push({role:"assistant", content: j.reply || "…"});
      if(j.pending_action) PENDING = j.pending_action;
    }
  }catch(e){ CHAT.push({role:"assistant", content:"Se cayó la conexión: "+e.message}); }
  if(btn){ btn.disabled = false; btn.textContent = "Enviar"; }
  drawChat(); drawPending();
}
function chatConfirm(si){
  if(!PENDING) return;
  const p = PENDING; PENDING = null; drawPending();
  if(!si){ CHAT.push({role:"assistant", content:"Listo, no hice nada."}); drawChat(); return; }
  chatSend("Sí, confirmo.", { tool:p.tool, input:p.input });
}

async function saveStripe(){
  const sk=($("stripe_sk").value||"").trim(), wh=($("stripe_wh").value||"").trim();
  if(!sk && !wh){ $("stripeMsg").textContent="Pega al menos una llave."; return; }
  try{
    if(sk){
      if(!/^(sk|rk)_/.test(sk)) throw new Error("la secret key empieza con sk_ (o rk_)");
      const {error}=await sb.rpc("vpa_set_payment_secret",{p_provider:"stripe",p_token:sk});
      if(error) throw error;
    }
    if(wh){
      if(!/^whsec_/.test(wh)) throw new Error("el signing secret empieza con whsec_");
      const {error}=await sb.rpc("vpa_set_payment_secret",{p_provider:"stripe_webhook",p_token:wh});
      if(error) throw error;
    }
    $("stripe_sk").value=""; $("stripe_wh").value="";
    $("stripeMsg").textContent="Guardado ✓";
    toast("Stripe guardado en el vault");
    loadStripeStatus();
  }catch(e){ $("stripeMsg").textContent="Error: "+e.message; }
}

async function loadTransferSettings(){
  try{
    const { data } = await sb.from("app_vpa_settings").select("*").eq("key","payments_transfer").maybeSingle();
    const v=(data&&data.value)||{};
    if($("tr_enabled")) $("tr_enabled").checked = !!v.enabled;
    if($("tr_bank"))    $("tr_bank").value  = v.bank||"";
    if($("tr_clabe"))   $("tr_clabe").value = v.clabe||"";
    if($("tr_benef"))   $("tr_benef").value = v.beneficiary||"";
    if($("tr_note"))    $("tr_note").value  = v.note||"";
  }catch(_){}
}
async function saveTransferInfo(){
  const clabe=($("tr_clabe").value||"").replace(/\D/g,"");
  const on=$("tr_enabled").checked;
  if(on && clabe.length!==18){ $("trMsg").textContent="La CLABE debe tener 18 dígitos."; return; }
  const v={ enabled:on, bank:($("tr_bank").value||"").trim(), clabe, beneficiary:($("tr_benef").value||"").trim(), note:($("tr_note").value||"").trim() };
  try{
    const {error}=await sb.rpc("vpa_update_settings",{p_key:"payments_transfer",p_value:v});
    if(error) throw error;
    $("tr_clabe").value=clabe;
    $("trMsg").textContent = on ? "Guardado ✓ — ya aparece en el checkout." : "Guardado ✓ — desactivada.";
    toast("Datos de transferencia guardados");
  }catch(e){ $("trMsg").textContent="Error: "+e.message; }
}

/* ============ MEMBRESÍAS ============ */
RENDER.memberships=async ()=>{
  const planOpts=PLANS.map(p=>`<option value="${p.id}">${esc(p.name_es)} · ${p.commission_pct}% comisión · ${usd(p.monthly_cents)}/mes</option>`).join("");
  const specOpts=SPECS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  $("main").innerHTML=`<div class="sec-head"><h2>Membresías</h2></div>
    <div class="hint">Planes: <b>Comunidad</b> (gratis, 50%) · <b>ON</b> $11/mes · $111/año (30%) · <b>Amplified</b> $44/mes · $444/año (20%) · <b>Global Exposure</b> $144/mes · $1,440/año (10%). Asignar una membresía activa fija la comisión de venta de esa voz y le abona sus créditos de marketing. El cobro real llega con FlowShare; aquí registras el acuerdo.</div>
    <div class="card" style="display:block">
      <div class="row2"><div class="field"><label>Voz</label><select id="mb_spec">${specOpts}</select></div>
        <div class="field"><label>Plan</label><select id="mb_plan">${planOpts}</select></div></div>
      <div class="row2"><div class="field"><label>Periodo</label><select id="mb_period"><option value="monthly">Mensual</option><option value="yearly">Anual</option></select></div>
        <div class="field"><label>Estado</label><select id="mb_status"><option value="active">active</option><option value="pending">pending</option></select></div></div>
      <div class="field"><label>Código de descuento (opcional)</label><input id="mb_code" style="text-transform:uppercase" placeholder="EJ. AMIGA20"></div>
      <button class="btn btn-primary btn-sm" onclick="setMembership()">Asignar membresía</button>
    </div>
    <div id="rows"><div class="empty">Cargando…</div></div>`;
  const { data, error } = await sb.from("app_vpa_subscriptions").select("*").in("status",["active","pending","past_due"]).order("created_at",{ascending:false});
  if(error){ $("rows").innerHTML=`<div class="empty">Error: ${esc(error.message)}</div>`; return; }
  if(!data.length){ $("rows").innerHTML=`<div class="empty">Ninguna voz tiene membresía activa todavía (todas en Comunidad, 50%).</div>`; return; }
  $("rows").innerHTML=data.map(s=>`<div class="card"><div class="grow">
    <h4>${esc(specName(s.specialist_id))} <span class="pill ${s.status==="active"?"published":"pending"}">${esc(planName(s.plan_id))} · ${esc(s.status)}</span></h4>
    <div class="meta">${esc(s.period)} · ${usd(s.price_cents)}${s.code?" · código "+esc(s.code):""}${s.current_period_end?" · hasta "+new Date(s.current_period_end).toLocaleDateString("es-MX"):""}</div></div>
    <div class="acts"><select class="btn-sm" style="padding:6px;border-radius:8px" onchange="updateSub('${s.id}',this.value)">
      ${["active","past_due","canceled"].map(x=>`<option ${x===s.status?"selected":""}>${x}</option>`).join("")}</select></div></div>`).join("");
};
async function setMembership(){
  const p={ specialist_id:$("mb_spec").value, plan_id:$("mb_plan").value, period:$("mb_period").value, status:$("mb_status").value, code:$("mb_code").value.trim() };
  if(!p.specialist_id) return toast("Elige una voz");
  try{ const {error}=await sb.rpc("vpa_admin_set_subscription",{payload:p}); if(error)throw error; toast("Membresía asignada ✓"); RENDER.memberships(); }catch(e){ toast("Error: "+e.message);} }
async function updateSub(id,status){ try{ const {error}=await sb.rpc("vpa_admin_set_subscription",{payload:{id,status,plan_id:"free",period:"monthly"}}); if(error)throw error; toast("Actualizado"); RENDER.memberships(); }catch(e){ toast("Error: "+e.message);} }

/* ============ CÓDIGOS Y REFERIDOS ============ */
RENDER.codes=async ()=>{
  const specOpts=`<option value="">— nadie —</option>`+SPECS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  $("main").innerHTML=`<div class="sec-head"><h2>Códigos y referidos</h2>
      <button class="btn btn-primary" onclick="openCode()">+ Nuevo código</button></div>
    <div class="hint"><b>Aquí creas TODOS los códigos.</b> Un código puede ser: <b>(1) Descuento</b> — % o monto fijo que el cliente escribe en el checkout de <code>/unete</code>. <b>(2) Partner/Comunidad</b> — además del descuento, paga <b>comisión</b> a una Voz cada vez que se usa. Puedes fijar la <b>duración</b> (permanente o los primeros N meses) y límites (usos, vencimiento). Cada código trae su <b>link para compartir</b> (botón “Copiar link” / WhatsApp). Todo se valida y registra solo.</div>
    <div id="codeForm"></div>
    <div id="rows"><div class="empty">Cargando…</div></div>`;
  window.__specOptsCode=specOpts;
  const { data, error } = await sb.from("app_vpa_codes").select("*").order("created_at",{ascending:false});
  if(error){ $("rows").innerHTML=`<div class="empty">Error: ${esc(error.message)}</div>`; return; }
  if(!data.length){ $("rows").innerHTML=`<div class="empty">Sin códigos todavía.</div>`; return; }
  $("rows").innerHTML=data.map(c=>{
    const disc=c.discount_type==="percent"?`${c.discount_value}%`:mxn(c.discount_value);
    const dur=(c.discount_value>0)?(c.duration_months?` · ${c.duration_months} meses`:` · permanente`):"";
    const refc=(c.referrer||c.referrer_specialist)?` · comisión: ${c.referrer_commission_type==="percent"?c.referrer_commission_value+"%":mxn(c.referrer_commission_value)}${c.referrer_specialist?" ("+esc(specName(c.referrer_specialist))+")":""}`:"";
    const isRef=(c.notes==="referral");
    return `<div class="card"><div class="grow">
      <h4>${esc(c.code)} <span class="pill ${c.active?"published":"hidden"}">${c.active?"activo":"inactivo"}</span>${isRef?' <span class="pill">referido</span>':''}</h4>
      <div class="meta">${c.discount_value>0?"−"+disc+dur:"sin descuento"} · aplica: ${c.applies_plans.join("/")}${c.applies_orders?" + tienda":""}${refc} · usos ${c.uses}${c.max_uses?"/"+c.max_uses:""}${c.expires_at?" · vence "+new Date(c.expires_at).toLocaleDateString("es-MX"):""}${c.notes&&!isRef?" · "+esc(c.notes):""}</div></div>
      <div class="acts">
        <button class="btn btn-ghost btn-sm" onclick="copyRef('${esc(c.code)}')">🔗 Copiar link</button>
        <a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Únete a Voces para el Alma con mi enlace: https://voces.world/crear-perfil?ref='+c.code)}">WhatsApp</a>
        <button class="btn btn-ghost btn-sm" onclick='openCode(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Editar</button></div></div>`;
  }).join("");
};
function openCode(c){
  c=c||{};
  const plans=["basic","pro"];
  const dval  = (c.discount_type==="amount") ? (c.discount_value? (c.discount_value/100):"") : (c.discount_value!=null?c.discount_value:"");
  const refval= (c.referrer_commission_type==="amount") ? (c.referrer_commission_value? (c.referrer_commission_value/100):"") : (c.referrer_commission_value||"");
  $("codeForm").innerHTML=`<div class="card" style="display:block">
    <div class="bi">1 · El código</div>
    <div class="row2"><div class="field"><label>Código (lo que escribe el cliente)</label><input id="cd_code" style="text-transform:uppercase" placeholder="EJ. FUNDADORAS" value="${esc(c.code||"")}"></div>
      <div class="field"><label>Activo</label><select id="cd_active"><option value="true" ${c.active!==false?"selected":""}>Sí</option><option value="false" ${c.active===false?"selected":""}>No</option></select></div></div>

    <div class="bi">2 · El descuento</div>
    <div class="row2"><div class="field"><label>Tipo</label><select id="cd_dtype" onchange="cdLbls()"><option value="percent" ${c.discount_type!=="amount"?"selected":""}>Porcentaje (%)</option><option value="amount" ${c.discount_type==="amount"?"selected":""}>Monto fijo (pesos)</option></select></div>
      <div class="field"><label id="cd_dval_lbl">Porcentaje (%)</label><input id="cd_dval" type="number" min="0" step="1" value="${dval}"></div></div>
    <div class="field"><label>Duración del descuento</label><input id="cd_dur" type="number" min="1" placeholder="vacío = permanente · ej. 3 = sólo los primeros 3 meses, luego precio lleno" value="${c.duration_months||""}"></div>
    <div class="row2"><div class="field"><label>Aplica a planes</label><div class="chkgroup">${plans.map(p=>`<label class="chk"><input type="checkbox" data-cdp value="${p}" ${!c.applies_plans||c.applies_plans.includes(p)?"checked":""}> ${p}</label>`).join("")}</div></div>
      <div class="field"><label>¿Aplica también en la tienda?</label><select id="cd_orders"><option value="false" ${!c.applies_orders?"selected":""}>No</option><option value="true" ${c.applies_orders?"selected":""}>Sí</option></select></div></div>

    <div class="bi">3 · Partner / comunidad (opcional)</div>
    <div class="hint" style="margin:0 0 10px">Asigna una Voz para que este código le pague <b>comisión</b> cada vez que se use (código de partner/comunidad). Déjalo en “— nadie —” para un descuento normal.</div>
    <div class="row2"><div class="field"><label>Voz que refiere (partner)</label><select id="cd_refspec">${window.__specOptsCode||""}</select></div>
      <div class="field"><label id="cd_refval_lbl">Comisión (%)</label><input id="cd_refval" type="number" min="0" value="${refval}"></div></div>
    <div class="row2"><div class="field"><label>Tipo de comisión</label><select id="cd_reftype" onchange="cdLbls()"><option value="percent" ${c.referrer_commission_type!=="amount"?"selected":""}>Porcentaje (%)</option><option value="amount" ${c.referrer_commission_type==="amount"?"selected":""}>Monto (pesos)</option></select></div>
      <div class="field"><label>Puntos al partner por uso</label><input id="cd_pts" type="number" min="0" value="${c.points_per_use||""}"></div></div>

    <div class="bi">4 · Límites (opcional)</div>
    <div class="row2"><div class="field"><label>Máx. usos (vacío = ilimitado)</label><input id="cd_max" type="number" min="1" value="${c.max_uses||""}"></div>
      <div class="field"><label>Vence</label><input id="cd_exp" type="date" value="${c.expires_at?c.expires_at.slice(0,10):""}"></div></div>
    <div class="field"><label>Notas internas (no se muestran al cliente)</label><input id="cd_notes" value="${esc(c.notes==='referral'?'':(c.notes||''))}"></div>
    <button class="btn btn-primary btn-sm" onclick="saveCode('${c.id||""}')">Guardar código</button>
  </div>`;
  if(c.referrer_specialist) $("cd_refspec").value=c.referrer_specialist;
  cdLbls();
}
function cdLbls(){
  const dt=$("cd_dtype")?$("cd_dtype").value:"percent"; const dl=$("cd_dval_lbl"); if(dl) dl.textContent = dt==="amount"?"Monto en pesos (MXN)":"Porcentaje (%)";
  const rt=$("cd_reftype")?$("cd_reftype").value:"percent"; const rl=$("cd_refval_lbl"); if(rl) rl.textContent = rt==="amount"?"Comisión en pesos (MXN)":"Comisión (%)";
}
async function saveCode(id){
  const plansSel=[...document.querySelectorAll("[data-cdp]:checked")].map(e=>e.value);
  const code=$("cd_code").value.trim().toUpperCase();
  if(!code) return toast("Escribe un código");
  const dtype=$("cd_dtype").value, reftype=$("cd_reftype").value;
  const discount_value = dtype==="amount" ? Math.round(Number($("cd_dval").value||0)*100) : Number($("cd_dval").value||0);
  const referrer_commission_value = reftype==="amount" ? Math.round(Number($("cd_refval").value||0)*100) : Number($("cd_refval").value||0);
  if(!id){
    const { data:exist } = await sb.from("app_vpa_codes").select("id").eq("code",code).maybeSingle();
    if(exist){ return toast("Ya existe un código con ese nombre. Elige otro o edítalo."); }
  }
  const p={ id:id||"", code, active:$("cd_active").value, discount_type:dtype,
    discount_value, applies_plans:plansSel, applies_orders:$("cd_orders").value,
    referrer_specialist:$("cd_refspec").value||"", referrer_commission_type:reftype,
    referrer_commission_value, points_per_use:Number($("cd_pts").value||0),
    duration_months:$("cd_dur").value||"",
    max_uses:$("cd_max").value||"", expires_at:$("cd_exp").value?new Date($("cd_exp").value).toISOString():"", notes:$("cd_notes").value.trim() };
  try{ const {error}=await sb.rpc("vpa_upsert_code",{payload:p}); if(error)throw error; toast("Código guardado ✓"); $("codeForm").innerHTML=""; RENDER.codes(); }catch(e){ toast("Error: "+e.message);} }
async function copyRef(code){
  const link="https://voces.world/crear-perfil?ref="+code;
  try{ await navigator.clipboard.writeText(link); toast("Link de registro copiado ✓"); }
  catch(_){ prompt("Copia el link para compartir:", link); }
}

/* ============ PUNTOS Y CRÉDITOS ============ */
RENDER.points=async ()=>{
  const specOpts=SPECS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  $("main").innerHTML=`<div class="sec-head"><h2>Puntos y créditos</h2></div>
    <div class="hint">Voces Points (gamificación) y créditos de marketing. Puedes otorgar puntos a un usuario o abonar créditos a una voz (campañas regaladas, material profesional). Las reglas automáticas de puntos viven en Ajustes → points_rules.</div>
    <div class="card" style="display:block">
      <h4 style="margin-bottom:10px">Abonar créditos a una voz</h4>
      <div class="row2"><div class="field"><label>Voz</label><select id="cr_spec">${specOpts}</select></div>
        <div class="field"><label>Monto (centavos USD)</label><input id="cr_amt" type="number" placeholder="4400 = $44"></div></div>
      <div class="field"><label>Motivo</label><input id="cr_reason" placeholder="campaña regalada / material"></div>
      <button class="btn btn-primary btn-sm" onclick="grantCredits()">Abonar créditos</button>
    </div>
    <div id="rows"><div class="empty">Cargando movimientos…</div></div>`;
  const [{ data:pts }, { data:crs }] = await Promise.all([
    sb.from("app_vpa_points").select("*").order("created_at",{ascending:false}).limit(50),
    sb.from("app_vpa_credits").select("*").order("created_at",{ascending:false}).limit(50)
  ]);
  const rows=[]
    .concat((pts||[]).map(p=>`<div class="card"><div class="grow"><h4 style="font-size:14px">+${p.points} pts</h4><div class="meta">${esc(p.reason||"")} · ${new Date(p.created_at).toLocaleString("es-MX")}</div></div></div>`))
    .concat((crs||[]).map(c=>`<div class="card"><div class="grow"><h4 style="font-size:14px">${c.delta_cents>=0?"+":""}${usd(c.delta_cents)} créditos</h4><div class="meta">${c.specialist_id?esc(specName(c.specialist_id)):""} · ${esc(c.reason||"")} · ${new Date(c.created_at).toLocaleString("es-MX")}</div></div></div>`));
  $("rows").innerHTML=rows.length?rows.join(""):`<div class="empty">Sin movimientos todavía.</div>`;
};
async function grantCredits(){
  const spec=$("cr_spec").value, amt=Number($("cr_amt").value||0), reason=$("cr_reason").value.trim();
  if(!spec||!amt) return toast("Elige voz y monto");
  try{ const {error}=await sb.rpc("vpa_grant_credits",{p_specialist:spec,p_delta_cents:amt,p_reason:reason||"admin_grant"}); if(error)throw error; toast("Créditos abonados ✓"); RENDER.points(); }catch(e){ toast("Error: "+e.message);} }

      <h4 style="margin-bottom:12px">Contacto</h4>
      <div class="field"><label>Correo público</label><input id="s_email" value="${esc(c.email||"")}"></div>
      <div class="field"><label>WhatsApp / teléfono</label><input id="s_wa" value="${esc(c.whatsapp||"")}"></div>
      <div class="row2"><div class="field"><label><span class="bi">es</span> Atención</label><input id="s_att_es" value="${esc(c.attention_es||"")}"></div>
        <div class="field"><label><span class="bi">en</span> Attention</label><input id="s_att_en" value="${esc(c.attention_en||"")}"></div></div>

    </div>
    <div class="card" style="display:block">
      <h4 style="margin-bottom:12px">Redes sociales (URLs)</h4>
      <div class="row2">
        <div class="field"><label>Instagram</label><input id="s_ig" value="${esc(s.instagram||"")}"></div>
        <div class="field"><label>Facebook</label><input id="s_fb" value="${esc(s.facebook||"")}"></div>
        <div class="field"><label>YouTube</label><input id="s_yt" value="${esc(s.youtube||"")}"></div>
        <div class="field"><label>Spotify</label><input id="s_sp" value="${esc(s.spotify||"")}"></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="saveSocials()">Guardar redes</button>

async function saveContact(){ const v={email:$("s_email").value.trim(),whatsapp:$("s_wa").value.trim(),attention_es:$("s_att_es").value.trim(),attention_en:$("s_att_en").value.trim()};
  try{ const {error}=await sb.rpc("vpa_update_settings",{p_key:"contact",p_value:v}); if(error)throw error; toast("Contacto guardado"); }catch(e){ toast("Error: "+e.message);} }
async function saveSocials(){ const v={instagram:$("s_ig").value.trim(),facebook:$("s_fb").value.trim(),youtube:$("s_yt").value.trim(),spotify:$("s_sp").value.trim()};
  try{ const {error}=await sb.rpc("vpa_update_settings",{p_key:"socials",p_value:v}); if(error)throw error; toast("Redes guardadas"); }catch(e){ toast("Error: "+e.message);} }

(async function init(){
  const r = await consumeAuthFromUrl();
  if(r.error){
    $("login").style.display="flex"; $("app").style.display="none";
    $("loginMsg").style.color="var(--bad)";
    $("loginMsg").textContent = "No se pudo iniciar sesión ("+r.error+"). Solicita un nuevo enlace de acceso abajo.";
    return;
  }
  await boot();
})();
</script>
