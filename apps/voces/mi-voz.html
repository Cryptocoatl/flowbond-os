<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Mi Voz · Voces para el Alma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --lino:#F7F2E9; --pergamino:#FCFAF4; --oro:#B68A3E; --oro-claro:#CBA15A;
    --salvia:#7E9078; --salvia-tenue:#E5EAE0; --pizarra:#4C6072; --tinta:#2C2722;
    --tinta-60:rgba(44,39,34,.62); --linea:rgba(44,39,34,.14);
    --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --r:14px;
    --ok:#3f7d59; --warn:#b5762a; --bad:#a4493e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--tinta);background:var(--lino);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
  a{color:var(--pizarra)}
  button{font-family:var(--sans);cursor:pointer}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:14px;padding:9px 16px;border-radius:100px;border:1px solid transparent;transition:.2s}
  .btn-primary{background:var(--tinta);color:var(--lino)}
  .btn-primary:hover{background:var(--oro)}
  .btn-primary:disabled{opacity:.55}
  .btn-ghost{background:transparent;color:var(--tinta);border:1px solid var(--linea)}
  .btn-ghost:hover{border-color:var(--tinta)}
  .btn-sm{padding:6px 12px;font-size:13px}
  input,select,textarea{font-family:var(--sans);font-size:14px;color:var(--tinta);background:var(--pergamino);
    border:1px solid var(--linea);border-radius:10px;padding:10px 12px;width:100%}
  textarea{min-height:90px;resize:vertical}
  label{display:block;font-size:12px;font-weight:600;color:var(--tinta-60);margin:0 0 5px}
  :focus-visible{outline:2px solid var(--oro);outline-offset:2px}

  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{background:var(--pergamino);border:1px solid var(--linea);border-radius:22px;padding:38px;max-width:440px;width:100%}
  .gate-card .ring{display:block;text-align:center;margin-bottom:12px}
  .gate-card h1{font-size:26px;text-align:center;margin-bottom:6px}
  .gate-card p.sub{color:var(--tinta-60);font-size:14px;margin-bottom:20px;text-align:center}
  .gate-card .field{margin-bottom:12px}
  .claim-hero{display:flex;gap:14px;align-items:center;background:var(--lino);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:18px}
  .claim-hero .ph{width:60px;height:60px;border-radius:50%;background:var(--salvia-tenue) center/cover no-repeat;flex:none}
  .msg{margin-top:12px;font-size:13.5px;min-height:18px}

  #app{display:none;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
    height:62px;padding:0 22px;background:rgba(247,242,233,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--linea)}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px}
  .top-right{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--tinta-60)}
  .bell{position:relative}
  .bell .dot{position:absolute;top:-4px;right:-4px;background:var(--oro);color:#fff;font-size:10px;font-weight:600;min-width:16px;height:16px;border-radius:100px;display:none;align-items:center;justify-content:center;padding:0 4px}
  .bell .dot.on{display:flex}
  .layout{display:flex;align-items:flex-start;max-width:960px;margin:0 auto;width:100%}
  .nav{position:sticky;top:62px;flex:none;width:190px;padding:22px 14px;height:calc(100vh - 62px);overflow:auto}
  .nav button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--tinta-60);font-weight:500}
  .nav button:hover{background:rgba(44,39,34,.05);color:var(--tinta)}
  .nav button.active{background:var(--tinta);color:var(--lino)}
  .main{flex:1;min-width:0;padding:26px 26px 80px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .sec-head h2{font-size:24px}
  .hint{color:var(--tinta-60);font-size:13.5px;margin:-4px 0 18px;max-width:62ch}
  .card{background:var(--pergamino);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .card h4{font-size:16px;margin-bottom:3px}
  .card .meta{font-size:12.5px;color:var(--tinta-60)}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em}
  .pill.published{background:#e3efe7;color:var(--ok)}
  .pill.pending{background:#f4e9d8;color:var(--warn)}
  .pill.info{background:#e6eef4;color:var(--pizarra)}
  .pill.hidden{background:#f3e2df;color:var(--bad)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-bottom:14px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chkgroup{display:flex;gap:14px;flex-wrap:wrap}
  .chk{display:flex;align-items:center;gap:7px;font-size:14px}
  .chk input{width:auto}
  .unread{border-left:3px solid var(--oro)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:var(--lino);
    padding:12px 20px;border-radius:100px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .empty{color:var(--tinta-60);font-size:14px;padding:26px;text-align:center;border:1px dashed var(--linea);border-radius:var(--r)}
  @media(max-width:760px){ .nav{position:static;width:100%;height:auto;display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--linea)}
    .layout{flex-direction:column}.row2{grid-template-columns:1fr} }
</style>
</head>
<body>

<!-- GATE: claim onboarding OR password login -->
<div id="gate">
  <div class="gate-card" id="gateCard">
    <span class="ring"><svg width="44" height="44" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="15.5" stroke="#CBA15A" stroke-width="1"/><circle cx="17" cy="17" r="10.5" stroke="#7E9078" stroke-width="1"/><circle cx="17" cy="17" r="4.6" fill="#B68A3E"/></svg></span>
    <h1>Mi Voz</h1>
    <p class="sub">Tu espacio en Voces para el Alma.</p>
    <div id="gateBody"></div>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="15.5" stroke="#CBA15A" stroke-width="1"/><circle cx="17" cy="17" r="10.5" stroke="#7E9078" stroke-width="1"/><circle cx="17" cy="17" r="4.6" fill="#B68A3E"/></svg>
      <span>Mi Voz</span>
    </div>
    <div class="top-right">
      <a href="/" target="_blank">Ver sitio ↗</a>
      <span id="whoami"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="layout">
    <nav class="nav" id="nav"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://fgsrcxxccdjqyrpkitmk.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnc3JjeHhjY2RqcXlycGtpdG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NDcxNzQsImV4cCI6MjA5MjEyMzE3NH0.vE20bvXPaLR8uaBUgVlwKwaoQgETfWcNIVpswgEj6xk";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth:{ detectSessionInUrl:false, persistSession:true, autoRefreshToken:true } });
const FN_BASE = SUPABASE_URL + "/functions/v1/";

const $=id=>document.getElementById(id);
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const usd=c=>"$"+((Number(c)||0)/100).toLocaleString("en-US",{maximumFractionDigits:2})+" USD";
let toastTimer; function toast(m){ const e=$("toast"); e.textContent=m; e.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>e.classList.remove("show"),3000); }
const KIND_ES={libro:"Libro",ebook:"Ebook",audiolibro:"Audiolibro",audio:"Audio",test:"Test",curso:"Curso",coaching:"Coaching",sesion_individual:"Sesión individual",sesion_grupal:"Sesión grupal",retiro:"Retiro",conferencia:"Conferencia",otro:"Otro"};
const KINDS=Object.keys(KIND_ES);
const PHOTO_BASE=SUPABASE_URL+"/storage/v1/object/public/vpa-photos/";
function img(n){ return !n?"":(String(n).startsWith("http")?n:PHOTO_BASE+n); }

let ME=null;     // vpa_my_profile()
let PLANS=[];
let COMM=null;   // vpa_my_commission() — % que retiene Voces + si ya lo aceptaste

/* ============ GATE (claim / login) ============ */
const claimToken = new URLSearchParams(location.search).get("claim");

async function initGate(){
  if(claimToken){ await renderClaim(); }
  else renderLogin();
}
function renderLogin(){
  $("gateBody").innerHTML=`
    <form onsubmit="doLogin(event)">
      <div class="field"><label>Correo</label><input id="lg_email" type="email" required autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input id="lg_pass" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Entrar</button>
    </form>
    <p class="sub" style="margin-top:14px">¿Aún no tienes tu perfil? <a href="/crear-perfil">Súmate aquí</a>. Si el equipo de Voces te compartió un enlace de reclamo, ábrelo para activar tu cuenta.</p>`;
}
async function renderClaim(){
  $("gateMsg").textContent="Verificando enlace…";
  const { data:info, error } = await sb.rpc("vpa_claim_info",{ p_token:claimToken });
  $("gateMsg").textContent="";
  if(error || !info || !info.valid){
    $("gateBody").innerHTML=`<p class="sub">Este enlace de reclamo ya no es válido (expiró, se usó o el perfil ya fue reclamado).</p>
      <button class="btn btn-ghost" style="width:100%;justify-content:center" onclick="location.href='/mi-voz'">Ir a iniciar sesión</button>`;
    return;
  }
  $("gateBody").innerHTML=`
    <div class="claim-hero">
      <div class="ph" style="background-image:url('${info.photo_url?esc(img(info.photo_url)):""}')"></div>
      <div><b>${esc(info.name)}</b><div class="meta" style="font-size:12.5px;color:var(--tinta-60)">${esc(info.role_es||"")}</div>
        <div style="font-size:12px;color:var(--oro);font-weight:600">Este perfil es tuyo — actívalo</div></div>
    </div>
    <form onsubmit="doClaim(event)">
      <div class="field"><label>Tu correo</label><input id="cl_email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Crea una contraseña (mín. 8)</label><input id="cl_pass" type="password" minlength="8" required autocomplete="new-password"></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Activar mi perfil</button>
    </form>
    <p class="sub" style="margin-top:12px">Al activar, tu perfil queda ligado a tu cuenta y podrás administrar tu oferta, tus datos de cobro y tus mensajes con Voces.</p>`;
}
async function doLogin(e){
  e.preventDefault();
  $("gateMsg").style.color=""; $("gateMsg").textContent="Entrando…";
  const { error } = await sb.auth.signInWithPassword({ email:$("lg_email").value.trim(), password:$("lg_pass").value });
  if(error){ $("gateMsg").style.color="var(--bad)"; $("gateMsg").textContent="Error: "+error.message; return; }
  $("gateMsg").textContent=""; boot();
}
async function doClaim(e){
  e.preventDefault();
  const email=$("cl_email").value.trim(), password=$("cl_pass").value;
  $("gateMsg").style.color=""; $("gateMsg").textContent="Activando tu perfil…";
  try{
    const r=await fetch(FN_BASE+"vpa-claim",{ method:"POST", headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+SUPABASE_ANON },
      body:JSON.stringify({ token:claimToken, email, password }) });
    const j=await r.json();
    if(!r.ok || !j.ok){ throw new Error(j.error==="claim_invalid"?"El enlace ya no es válido.":(j.error||"No se pudo activar")); }
    // cuenta creada+confirmada por la función → iniciar sesión con la misma contraseña
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    history.replaceState({},"", "/mi-voz");
    $("gateMsg").textContent=""; boot();
  }catch(err){ $("gateMsg").style.color="var(--bad)"; $("gateMsg").textContent="Error: "+err.message; }
}
async function logout(){ await sb.auth.signOut(); location.href="/mi-voz"; }

/* ============ BOOT ============ */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("gate").style.display="flex"; $("app").style.display="none"; return; }
  const { data:prof } = await sb.rpc("vpa_my_profile");
  if(!prof){
    $("gate").style.display="flex"; $("app").style.display="none";
    $("gateBody").innerHTML=`<p class="sub">Tu cuenta (${esc(session.user.email)}) no tiene un perfil de especialista ligado todavía. Si ya te sumaste, pide a Voces tu enlace de reclamo; o <a href="/crear-perfil">crea tu perfil</a>.</p>
      <button class="btn btn-ghost" style="width:100%;justify-content:center" onclick="logout()">Salir</button>`;
    return;
  }
  ME=prof;
  const { data:plans } = await sb.from("app_vpa_plans").select("*").order("sort_order"); PLANS=plans||[];
  await loadCommission();
  $("gate").style.display="none"; $("app").style.display="block";
  $("whoami").textContent=session.user.email;
  buildNav(); await refreshBell(); go("perfil");
}

const SECTIONS=[["perfil","Mi perfil"],["mensajes","Mensajes"],["oferta","Mi oferta"],["cobros","Cobros"],["membresia","Membresía"],["referir","Refiere y gana"]];
function buildNav(){
  $("nav").innerHTML=SECTIONS.map(([k,l])=>`<button data-sec="${k}" onclick="go('${k}')">${l}${k==="mensajes"?` <span class="bell"><span class="dot" id="bellDot"></span></span>`:""}</button>`).join("");
}
function go(sec){ document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.sec===sec)); RENDER[sec](); }

async function refreshBell(){
  const { count } = await sb.from("app_vpa_notifications").select("*",{count:"exact",head:true}).is("read_at",null);
  const d=$("bellDot"); if(d){ if(count){ d.textContent=count; d.classList.add("on"); } else d.classList.remove("on"); }
}

/* ============ MI PERFIL (propone cambios; Voces aprueba) ============ */
const RENDER={};
RENDER.perfil=async ()=>{
  const s=ME; const share=location.origin+"/?voz="+(s.slug||s.id);
  $("main").innerHTML=`<div class="sec-head"><h2>Mi perfil</h2>
      <button class="btn btn-ghost btn-sm" onclick="copyShare('${esc(s.slug||s.id)}')">Compartir mi perfil</button></div>
    <div class="hint">Edita tu información y envía los cambios a Voces. <b>Se publican cuando el equipo los aprueba</b> y te avisamos aquí. Tu enlace para redes: <a href="${esc(share)}" target="_blank">${esc(share)}</a></div>
    <div class="card">
      <div class="field"><label>Nombre</label><input id="p_name" value="${esc(s.name||"")}"></div>
      <div class="row2">
        <div class="field"><label>Título profesional (ES)</label><input id="p_role_es" value="${esc(s.role_es||"")}"></div>
        <div class="field"><label>Título (EN)</label><input id="p_role_en" value="${esc(s.role_en||"")}"></div>
      </div>
      <div class="field"><label>Biografía (ES)</label><textarea id="p_bio_es">${esc(s.bio_es||"")}</textarea></div>
      <div class="field"><label>Bio (EN)</label><textarea id="p_bio_en">${esc(s.bio_en||"")}</textarea></div>
      <div class="row2">
        <div class="field"><label>Áreas de enfoque (ES, coma)</label><input id="p_focus_es" value="${esc((s.focus_es||[]).join(', '))}" placeholder="Inspiradora, Líder, Conexión"></div>
        <div class="field"><label>Focus (EN, coma)</label><input id="p_focus_en" value="${esc((s.focus_en||[]).join(', '))}"></div>
      </div>
      <div class="field"><label>Certificaciones</label><textarea id="p_certs_es" style="min-height:70px">${esc(s.certs_es||"")}</textarea></div>

      <div class="field"><label>Tu foto de perfil (se muestra circular)</label>
        <div style="display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center">
          <div id="photoPrev" role="img" aria-label="Tu foto"
               style="width:150px;height:150px;border-radius:50%;background:#efe8db center/cover no-repeat;border:1px solid var(--linea);${s.photo_url?`background-image:url('${esc(s.photo_url)}')`:""}"></div>
          <div>
            <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('photoFile').click()">Subir / cambiar foto</button>
            <input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp" hidden onchange="pickPhoto(this.files[0])">
            <p class="hint" style="margin-top:8px">Sube tu foto ya lista (JPG, PNG o WebP · máx 10 MB). Se muestra circular en el directorio y en tu perfil. Se publica cuando Voces aprueba tus cambios.</p>
          </div>
        </div>
      </div>
      <input type="hidden" id="p_photo" value="${esc(s.photo_url||"")}">
      <div class="field"><label class="chk"><input type="checkbox" id="p_avail" ${s.available_now?"checked":""}> Disponible ahora para nuevas personas</label></div>
      <div class="bi" style="font-size:11px;color:var(--oro);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:6px 0">Contacto privado (se revela sólo a quien inicia sesión y lo solicita)</div>
      <div class="row2">
        <div class="field"><label>Correo de contacto</label><input id="p_cemail" value="${esc(s.contact_email||"")}"></div>
        <div class="field"><label>WhatsApp / teléfono</label><input id="p_cphone" value="${esc(s.contact_phone||"")}"></div>
      </div>
      <div class="field"><label>Sitio web</label><input id="p_cweb" value="${esc(s.contact_web||"")}"></div>
      <div class="acts"><button class="btn btn-primary" onclick="proposeProfile()">Enviar cambios a Voces</button></div>
    </div>`;
};

/* ============ FOTO DE PERFIL (subida directa, se muestra circular) ============ */
let newPhotoBlob=null;      // foto recién elegida (File)
function pickPhoto(file){
  if(!file) return;
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){ toast("Usa JPG, PNG o WebP"); return; }
  if(file.size>10*1024*1024){ toast("Máx 10 MB"); return; }
  newPhotoBlob=file;
  const url=URL.createObjectURL(file);
  $("photoPrev").style.backgroundImage=`url('${url}')`;
}

function collectProfile(){
  return { name:$("p_name").value.trim(), role_es:$("p_role_es").value.trim(), role_en:$("p_role_en").value.trim(),
    bio_es:$("p_bio_es").value.trim(), bio_en:$("p_bio_en").value.trim(),
    focus_es:$("p_focus_es").value.split(",").map(x=>x.trim()).filter(Boolean),
    focus_en:$("p_focus_en").value.split(",").map(x=>x.trim()).filter(Boolean),
    certs_es:$("p_certs_es").value.trim(), certs_en:$("p_certs_es").value.trim(),
    photo_url:$("p_photo").value.trim(), available_now:$("p_avail").checked,
    contact_email:$("p_cemail").value.trim(), contact_phone:$("p_cphone").value.trim(), contact_web:$("p_cweb").value.trim() };
}
async function proposeProfile(){
  // Si hay foto nueva, súbela y usa su URL antes de calcular el diff
  try{
    if(newPhotoBlob){
      const uid=(ME.id||crypto.randomUUID());
      const ext=(newPhotoBlob.name.split(".").pop()||"jpg").toLowerCase();
      const path="profiles/"+uid+"/photo-"+crypto.randomUUID()+"."+ext;
      const { error:pe }=await sb.storage.from("vpa-photos").upload(path,newPhotoBlob,{contentType:newPhotoBlob.type,upsert:false});
      if(pe) throw pe;
      $("p_photo").value=PHOTO_BASE+path;
      newPhotoBlob=null;
    }
  }catch(e){ toast("No se pudo subir la foto: "+e.message); return; }

  const cur=collectProfile(); const changes={};
  Object.keys(cur).forEach(k=>{
    const a=cur[k], b=ME[k];
    const na=Array.isArray(a)?JSON.stringify(a):(a==null?"":String(a));
    const nb=Array.isArray(b)?JSON.stringify(b):(b==null?"":String(b));
    if(na!==nb) changes[k]=a;
  });
  if(!Object.keys(changes).length){ toast("No hay cambios"); return; }
  const message=prompt("¿Quieres dejar una nota para Voces sobre estos cambios? (opcional)")||"";
  try{ const {error}=await sb.rpc("vpa_open_change",{payload:{kind:"edit",changes,message}}); if(error)throw error;
    toast("Cambios enviados a Voces para aprobación ✓"); }catch(e){ toast("Error: "+e.message); }
}
async function copyShare(slug){ const url=location.origin+"/?voz="+slug; try{ await navigator.clipboard.writeText(url); toast("Enlace copiado ✓"); }catch(_){ prompt("Tu enlace:",url); } }

/* ============ MENSAJES (notificaciones + hilos) ============ */
RENDER.mensajes=async ()=>{
  $("main").innerHTML=`<div class="sec-head"><h2>Mensajes</h2>
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()">Marcar leídos</button></div>
    <div class="hint">Notificaciones de Voces y conversaciones sobre tu perfil. Cuando Voces te sugiere un cambio, puedes <b>aceptarlo</b> (se publica) o responder para conversar.</div>
    <div id="notifs"></div>
    <h3 style="font-size:18px;margin:20px 0 10px">Conversaciones</h3>
    <div id="threads"><div class="empty">Cargando…</div></div>`;
  const { data:notifs } = await sb.from("app_vpa_notifications").select("*").order("created_at",{ascending:false}).limit(30);
  $("notifs").innerHTML=(notifs&&notifs.length)?notifs.map(n=>`<div class="card ${n.read_at?"":"unread"}">
      <h4>${esc(n.title)}</h4>${n.body?`<div class="meta" style="margin-top:3px;color:var(--tinta)">${esc(n.body)}</div>`:""}
      <div class="meta" style="margin-top:4px">${new Date(n.created_at).toLocaleString("es-MX")}</div></div>`).join("")
    :`<div class="empty">Sin notificaciones.</div>`;
  const { data:reqs } = await sb.from("app_vpa_change_requests").select("*").order("created_at",{ascending:false}).limit(50);
  if(!reqs||!reqs.length){ $("threads").innerHTML=`<div class="empty">Sin conversaciones todavía.</div>`; }
  else{
    const ids=reqs.map(r=>r.id);
    const { data:msgs } = await sb.from("app_vpa_change_messages").select("*").in("request_id",ids).order("created_at");
    const byReq={}; (msgs||[]).forEach(m=>(byReq[m.request_id]=byReq[m.request_id]||[]).push(m));
    $("threads").innerHTML=reqs.map(r=>{
      const fromVoces=r.opened_role==="super_admin";
      const kindLbl={comment:"comentario",suggestion:"sugerencia",edit:"cambio propuesto"}[r.kind]||r.kind;
      const chg=r.changes&&Object.keys(r.changes).length?Object.keys(r.changes).join(", "):"";
      const thread=(byReq[r.id]||[]).map(m=>`<div style="margin:4px 0;font-size:13px"><b>${m.author_role==="super_admin"?"Voces":"Tú"}:</b> ${esc(m.body)}</div>`).join("");
      const pill={open:"pending",applied:"published",rejected:"hidden",withdrawn:"info"}[r.status]||"pending";
      let actions="";
      if(r.status==="open"){
        // Voces sugirió → puedo aceptar (se publica) o rechazar
        if(fromVoces && chg && r.kind!=="comment"){ actions+=`<button class="btn btn-primary btn-sm" onclick="resolveMine('${r.id}','accept')">Aceptar y publicar</button>`;
          actions+=`<button class="btn btn-ghost btn-sm" onclick="resolveMine('${r.id}','reject')">Rechazar</button>`; }
        // yo lo abrí → puedo retirarlo
        if(!fromVoces){ actions+=`<button class="btn btn-ghost btn-sm" onclick="resolveMine('${r.id}','withdraw')">Retirar</button>`; }
        actions+=`<button class="btn btn-ghost btn-sm" onclick="replyMine('${r.id}')">Responder</button>`;
      }
      return `<div class="card"><h4>${fromVoces?"Voces":"Tú"} · ${kindLbl} <span class="pill ${pill}">${esc(r.status)}</span></h4>
        <div class="meta">${new Date(r.created_at).toLocaleString("es-MX")}${chg?` · campos: ${esc(chg)}`:""}</div>
        ${thread?`<div style="margin-top:8px">${thread}</div>`:""}
        <div class="acts">${actions}</div></div>`;
    }).join("");
  }
  await sb.rpc("vpa_mark_notifications_read"); refreshBell();
};
async function markAllRead(){ try{ await sb.rpc("vpa_mark_notifications_read"); toast("Listo"); refreshBell(); RENDER.mensajes(); }catch(e){ toast("Error: "+e.message);} }
async function resolveMine(id,action){ try{ const {error}=await sb.rpc("vpa_resolve_change",{p_request:id,p_action:action}); if(error)throw error;
  toast(action==="accept"?"Publicado ✓":"Listo"); if(action==="accept"){ const {data}=await sb.rpc("vpa_my_profile"); if(data) ME=data; } RENDER.mensajes(); }catch(e){ toast("Error: "+e.message);} }
async function replyMine(id){ const b=prompt("Tu respuesta:"); if(!b||!b.trim())return; try{ const {error}=await sb.rpc("vpa_reply_change",{p_request:id,p_body:b.trim()}); if(error)throw error; toast("Enviado"); RENDER.mensajes(); }catch(e){ toast("Error: "+e.message);} }

// Punto 4 · la voz elige cómo se anuncia su producto (antes lo decidía el sistema).
const PILL_OPTS=[["","Automático"],["disponible","Disponible ahora"],["reserva","Reserva ahora"],
  ["proximamente","Próximamente"],["ninguna","Sin píldora"]];
// Punto 6/8 · sesión individual o grupal = agenda obligatoria para publicar.
const SESSION_KINDS=["sesion_individual","sesion_grupal"];
function bookNotice(){
  const box=document.getElementById("of_bookNotice"); if(!box) return;
  const need=SESSION_KINDS.includes(($("of_kind")||{}).value);
  box.innerHTML = need
    ? `<div class="hint" style="border:1px solid #d9b25a;background:rgba(203,161,90,.12);border-radius:10px;padding:11px 13px;margin:4px 0 12px;color:#7a5a12">
         <b>El enlace de agenda es obligatorio</b> para las sesiones individuales y grupales.
         Puedes guardar el resto ahora, pero tu oferta <b>no se publicará</b> hasta que lo agregues.
       </div>` : "";
}
/* ---- Comisión de Voces: leyenda + aceptación obligatoria ------------------
   Nada se puede vender por la plataforma sin que la voz haya aceptado, de forma
   explícita, el porcentaje que le corresponde a su cuenta. Queda registrado
   quién aceptó, cuándo y bajo qué porcentaje (respaldo formal). */
async function loadCommission(){
  try{ const { data } = await sb.rpc("vpa_my_commission"); COMM = (data&&data.ok)?data:null; }
  catch(_){ COMM=null; }
}
function commissionText(pct){
  return `Por cada venta que realices a través de Voces, la plataforma retiene una comisión del <b>${pct}%</b>. `
    + `Es la misma lógica que aplica en cualquier plataforma: a cambio, recibes exposición internacional, `
    + `herramientas de gestión y cobro, y un espacio donde tu trabajo puede crecer sin límite de fronteras. `
    + `No te estamos dando un lugar donde publicar, te estamos proponiendo un negocio en conjunto, `
    + `con depósitos prácticamente inmediatos según la forma de cobro que hayas configurado.`;
}
function commissionBlock(){
  if(!COMM) return "";
  const pct=COMM.commission_pct;
  const done=!!COMM.accepted;
  return `<div id="commBox" class="hint" style="border:1px solid #d9b25a;background:rgba(203,161,90,.10);border-radius:10px;padding:13px 15px;margin:6px 0 14px;color:#5c4a1e;line-height:1.55">
      ${commissionText(pct)}
      ${done
        ? `<div style="margin-top:9px;color:#4c7a4c;font-weight:600">✓ Aceptaste esta comisión el ${
             new Date(COMM.accepted_at).toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}.</div>`
        : `<label class="chk" style="display:flex;gap:9px;align-items:flex-start;margin-top:11px;font-weight:600">
             <input type="checkbox" id="of_commOk" style="margin-top:3px">
             <span>Entiendo y acepto la comisión del ${pct}% aplicable a mi cuenta.</span></label>`}
    </div>`;
}
// Sólo estorba cuando de verdad aplica: al vender a través de Voces.
function commissionToggle(){
  const box=document.getElementById("commWrap"); if(!box) return;
  const on=($("of_via")||{}).checked;
  box.innerHTML = on ? commissionBlock() : "";
}
async function ensureCommissionAccepted(){
  if(!COMM || COMM.accepted) return true;
  const chk=document.getElementById("of_commOk");
  if(!chk || !chk.checked){
    toast("Marca la casilla de aceptación de la comisión para poder vender por Voces");
    if(chk) chk.focus();
    return false;
  }
  const { error } = await sb.rpc("vpa_accept_commission",{ p_pct:COMM.commission_pct, p_source:"mi-voz" });
  if(error){ toast("No se pudo registrar la aceptación: "+error.message); return false; }
  await loadCommission();
  return true;
}

    <div class="field"><label>Título</label><input id="of_title" value="${esc(o.title||"")}"></div>

    <div class="field"><label>Enlace externo (Amazon / tu tienda) <small style="color:#a49a88">— deshabilitado por ahora</small></label>
      <input id="of_url" value="${esc(o.external_url||"")}" disabled style="background:#efeae1;color:#a49a88;cursor:not-allowed">
      <div class="hint" style="color:#a49a88">Esta función todavía no está lista. Sube tu archivo aquí abajo o véndelo a través de Voces.</div></div>

    <div class="row2">
      <div class="field"><label>Imagen de portada</label>
        <div id="of_coverPrev" style="width:100%;height:120px;border-radius:10px;background:#efe8db center/cover no-repeat;border:1px solid var(--linea);${o.cover_url?`background-image:url('${esc(o.cover_url)}')`:""}"></div>
        <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="document.getElementById('of_coverFile').click()">Subir portada</button>
        <input type="file" id="of_coverFile" accept="image/*" hidden onchange="uploadOfferMedia(this.files[0],'cover')">

        <div id="of_audioPrev">${o.preview_url?`<audio controls src="${esc(o.preview_url)}" style="width:100%"></audio>`:`<div style="color:#a49a88;font-size:13px;padding:8px 0">Sin audio</div>`}</div>
        <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="document.getElementById('of_audioFile').click()">Subir audio</button>
        <input type="file" id="of_audioFile" accept="audio/*" hidden onchange="uploadOfferMedia(this.files[0],'preview')">

    <div class="field"><label class="chk"><input type="checkbox" id="of_wip" ${o.in_progress?"checked":""}> Obra en proceso</label></div>
    <div class="acts"><button class="btn btn-primary" onclick="saveOffer('${o.id||""}')">Guardar</button>

// ISO → valor de <input type="datetime-local"> en hora local
function toLocalInput(iso){
  if(!iso) return "";
  const d=new Date(iso); if(isNaN(d.getTime())) return "";
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const OFFER_BAD_EXT=["exe","bat","cmd","com","scr","msi","app","dll","js","mjs","jar","sh","bash","bin","apk","deb","dmg","pkg","svg","vbs","ps1","wsf","cpl","gadget","jse","msc"];
async function uploadOfferMedia(file, slot){
  if(!file) return;
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(slot==="cover"){ if(!/^image\//.test(file.type)) return toast("Elige una imagen"); }
  else if(slot==="preview"){ if(!/^audio\//.test(file.type)) return toast("Elige un audio"); }
  else { if(OFFER_BAD_EXT.includes(ext)) return toast("Por seguridad no se permite ese tipo de archivo (ejecutable/script)."); }
  const maxMB = slot==="cover"?8:60;
  if(file.size>maxMB*1024*1024) return toast("Máx "+maxMB+" MB");
  const safeExt=ext||(slot==="cover"?"jpg":slot==="preview"?"mp3":"pdf");
  const path="offers/"+(ME.id||"anon")+"/"+slot+"-"+crypto.randomUUID()+"."+safeExt;
  toast("Subiendo…");
  try{
    const { error }=await sb.storage.from("vpa-photos").upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
    if(error) throw error;
    const url=PHOTO_BASE+path;
    if(slot==="cover"){ $("of_cover").value=url; $("of_coverPrev").style.backgroundImage=`url('${url}')`; }
    else if(slot==="preview"){ $("of_preview").value=url; $("of_audioPrev").innerHTML=`<audio controls src="${url}" style="width:100%"></audio>`; }
    else { $("of_file").value=url; if(!$("of_fileName").value.trim()) $("of_fileName").value=file.name;
           $("of_filePrev").innerHTML=`<a href="${url}" target="_blank" rel="noopener">📄 ${esc(file.name)}</a>`; }
    toast("Listo ✓");
  }catch(e){ toast("Error al subir: "+e.message); }
}
async function saveOffer(id){
  const price=$("of_price").value;
  const p={ id:id||"", kind:$("of_kind").value, title:$("of_title").value.trim(), description:$("of_desc").value.trim(),
    price_cents:price===""?"":Math.round(Number(price)*100), external_url:$("of_url").value.trim(),
    cover_url:$("of_cover").value.trim(), preview_url:$("of_preview").value.trim(),
    file_url:$("of_file").value.trim(), file_name:$("of_fileName").value.trim(),
    booking_url:$("of_booking").value.trim(), booking_label:$("of_bookingLabel").value.trim(),
    status_pill:$("of_pill").value,
    event_at:$("of_eventAt").value?new Date($("of_eventAt").value).toISOString():"",
    event_ends_at:$("of_eventEnd").value?new Date($("of_eventEnd").value).toISOString():"",
    event_location:$("of_eventPlace").value.trim(),
    sell_via_voces:$("of_via").checked, in_progress:$("of_wip").checked };
  if(!p.title) return toast("Escribe un título");
  // Vender por Voces exige aceptar la comisión vigente (el backend también lo exige).
  if(p.sell_via_voces && !(await ensureCommissionAccepted())) return;
  const needsBooking = SESSION_KINDS.includes(p.kind) && !p.booking_url;
  try{ const {error}=await sb.rpc("vpa_upsert_offering",{payload:p}); if(error)throw error;
    toast(needsBooking
      ? "Guardado — falta tu enlace de agenda para que Voces pueda publicarla"
      : "Guardado — pendiente de publicación por Voces ✓");
    const {data}=await sb.rpc("vpa_my_profile"); if(data) ME=data; $("offForm").innerHTML=""; RENDER.oferta(); }
  catch(e){
    const m=e&&e.message||"";
    if(/commission_terms_required/.test(m)){ toast("Falta aceptar la comisión de Voces para poder vender."); await loadCommission(); commissionToggle(); return; }
    if(/booking_required/.test(m)){ toast("Falta tu enlace de agenda: sin él la sesión no se puede publicar."); return; }
    toast("Error: "+m);
  }
}

/* ============ COBROS ============ */
/* Métodos de cobro internacionales. Cada voz puede tener varios y elegir el principal.
   El % que conserva lo define su acuerdo de reparto (sección "Membresía y acuerdo");
   aquí sólo se define POR DÓNDE le llega el dinero. */

  mercadopago:{label:"MercadoPago", tag:"", speed:"1–2 días hábiles",

  bank_intl:  {label:"Banco internacional", tag:"", speed:"2–5 días hábiles · tu banco suele cobrar comisión",

  paypal:     {label:"PayPal", tag:"🐢 Tarda varios días", speed:"3–5 días hábiles (a veces más) · comisión alta",
               hint:"Funciona en casi todos los países, pero <b>PayPal retiene el dinero varios días</b> y cobra comisión alta más su propio tipo de cambio. Elígelo sólo si no tienes ninguna de las opciones de arriba.", fields:["email","holder_name"]},
  credit:     {label:"Dejarlo como crédito en Voces", tag:"", speed:"Inmediato",
               hint:"No recibes dinero: tu saldo queda como crédito para usar dentro de Voces.", fields:[]}
};

/* Qué conviene según dónde vive la voz. El orden ES la recomendación. */
const RAILS_BY_COUNTRY={
  MX:["clabe","dolarapp","usdc","mercadopago","wise","payoneer","bank_intl","paypal"],
  AR:["usdc","dolarapp","wise","payoneer","bank_intl","paypal"],
  VE:["usdc","payoneer","bank_intl","paypal"],
  CO:["usdc","wise","payoneer","bank_intl","paypal"], CL:["usdc","wise","payoneer","bank_intl","paypal"],
  PE:["usdc","wise","payoneer","bank_intl","paypal"], UY:["usdc","wise","payoneer","bank_intl","paypal"],
  BO:["usdc","wise","payoneer","bank_intl","paypal"], PY:["usdc","wise","payoneer","bank_intl","paypal"],
  EC:["usdc","wise","payoneer","bank_intl","paypal"], BR:["wise","usdc","payoneer","bank_intl","paypal"],
  ES:["wise","payoneer","bank_intl","usdc","paypal"], US:["wise","payoneer","usdc","bank_intl","paypal"],
  CA:["wise","payoneer","usdc","bank_intl","paypal"], GB:["wise","payoneer","bank_intl","usdc","paypal"]
};
const RAILS_DEFAULT=["usdc","wise","payoneer","bank_intl","paypal"];
function railsFor(country){
  const base=RAILS_BY_COUNTRY[(country||"MX").toUpperCase()]||RAILS_DEFAULT;
  const rest=Object.keys(PAY_KINDS).filter(k=>!base.includes(k)&&k!=="credit");
  return [...base,...rest,"credit"];
}
function flagOf(c){
  if(!c||c.length!==2) return "🌍";
  try{ return String.fromCodePoint(...[...c.toUpperCase()].map(ch=>0x1F1E6+ch.charCodeAt(0)-65)); }
  catch(_){ return "🌍"; }
}
const COUNTRY_ES={MX:"México",AR:"Argentina",CO:"Colombia",CL:"Chile",PE:"Perú",ES:"España",
  US:"Estados Unidos",UY:"Uruguay",EC:"Ecuador",BO:"Bolivia",PY:"Paraguay",VE:"Venezuela",
  BR:"Brasil",CR:"Costa Rica",PA:"Panamá",GT:"Guatemala",SV:"El Salvador",HN:"Honduras",
  NI:"Nicaragua",DO:"República Dominicana",CU:"Cuba",PR:"Puerto Rico",CA:"Canadá",
  GB:"Reino Unido",FR:"Francia",DE:"Alemania",IT:"Italia",PT:"Portugal",NL:"Países Bajos"};
const countryName=c=>COUNTRY_ES[(c||"").toUpperCase()]||c||"—";
const PAY_LBL={email:"Correo de la cuenta",holder_name:"Titular de la cuenta",account_id:"Tag / usuario",
  clabe:"CLABE (18 dígitos)",bank_name:"Banco",wallet_address:"Dirección de tu wallet",chain:"Red",
  iban:"IBAN",account_number:"Número de cuenta",swift:"SWIFT / BIC",routing:"Routing number"};
const CHAINS=["base","polygon","solana","ethereum","arbitrum","optimism","tron"];
const mx=c=>"$"+((c||0)/100).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
let MYPAY=[], MYEARN=null;

RENDER.cobros=async ()=>{
  $("main").innerHTML=`<div class="sec-head"><h2>Cobros</h2></div><div class="hint">Cargando…</div>`;
  const [{data:methods},{data:earn}]=await Promise.all([
    sb.rpc("vpa_my_payout_methods"), sb.rpc("vpa_my_earnings")]);
  MYPAY=methods||[]; MYEARN=earn||{};
  const e=MYEARN;
  $("main").innerHTML=`<div class="sec-head"><h2>Cobros</h2></div>
    <div class="hint">Aquí defines <b>cómo recibes tu dinero</b>. Puedes tener varios métodos y marcar uno como principal; Voces te paga por ese. Cuánto te toca de cada venta lo define tu acuerdo de reparto (ve a “Membresía y acuerdo”).</div>
    <div class="card">
      <h4>Tu saldo</h4>
      <div class="row2">
        <div><div class="hint">Disponible por cobrar</div><div style="font-size:1.6rem;font-weight:700">${mx(e.available_cents)}</div></div>
        <div><div class="hint">En camino</div><div style="font-size:1.6rem;font-weight:700">${mx(e.paying_cents)}</div></div>
      </div>
      <div class="row2" style="margin-top:.6rem">
        <div><div class="hint">Ya cobrado</div><div>${mx(e.paid_cents)}</div></div>
        <div><div class="hint">Recibido directo en tus ventas con tarjeta</div><div>${mx(e.auto_split_cents)}</div></div>
      </div>
      ${e.auto_split_cents?`<div class="hint" style="margin-top:.6rem">En las compras con tarjeta tu parte llega <b>directo a tu cuenta</b> al momento; por eso ese monto no aparece como “por cobrar”.</div>`:``}
    </div>

    <div class="card">
      <h4>Tus métodos de cobro</h4>
      ${MYPAY.length?MYPAY.map(m=>`<div class="card" style="margin:.5rem 0">
        <div><b>${esc(PAY_KINDS[m.kind]?.label||m.kind)}</b> ${m.is_default?`<span class="pill">Principal</span>`:``}</div>
        <div class="hint">${esc(payDesc(m))}</div>
        <div class="acts">
          ${m.is_default?``:`<button class="btn" onclick="setDefaultPay('${m.id}')">Hacer principal</button>`}
          <button class="btn" onclick="editPay('${m.id}')">Editar</button>
          <button class="btn" onclick="delPay('${m.id}')">Eliminar</button>
        </div></div>`).join(""):`<div class="hint">Todavía no agregas ninguno. Sin un método de cobro no podemos enviarte tu dinero.</div>`}
      <div class="acts"><button class="btn btn-primary" onclick="newPay()">+ Agregar método de cobro</button></div>
      <div id="payForm"></div>
    </div>

    ${(e.payouts||[]).length?`<div class="card"><h4>Pagos que te hemos enviado</h4>
      ${e.payouts.map(p=>`<div style="padding:.4rem 0;border-bottom:1px solid #eee">
        <b>${mx(p.amount_cents)}</b> · ${esc(PAY_KINDS[p.kind]?.label||p.kind)} ·
        ${p.status==="paid"?"Pagado":(p.status==="processing"?"En camino":(p.status==="failed"?"Falló":"Pendiente"))}
        ${p.paid_at?` · ${new Date(p.paid_at).toLocaleDateString("es-MX")}`:``}
        ${p.provider_ref?`<div class="hint">Referencia: ${esc(p.provider_ref)}</div>`:``}
      </div>`).join("")}</div>`:``}

    ${(e.lines||[]).length?`<div class="card"><h4>De dónde viene tu saldo</h4>
      ${e.lines.map(l=>`<div style="padding:.35rem 0;border-bottom:1px solid #eee">
        <b>${mx(l.amount_cents)}</b> · ${esc(l.title||"Venta")}
        <span class="hint">${l.status==="settled_source"?"recibido directo":(l.status==="paid"?"cobrado":(l.status==="paying"?"en camino":"por cobrar"))}
        · ${new Date(l.created_at).toLocaleDateString("es-MX")}</span>
      </div>`).join("")}</div>`:``}`;
};

function payDesc(m){
  if(m.kind==="usdc") return `${m.wallet_address||""} · red ${String(m.chain||"").toUpperCase()}`;
  if(m.kind==="clabe") return `CLABE ••••${m.clabe_last4||"----"} · ${m.bank_name||""}`;
  if(m.kind==="bank_intl") return `Cuenta ••••${m.iban_last4||m.account_last4||"----"} · ${m.swift||""} · ${m.country||""}`;
  return m.email||m.account_id||m.holder_name||"—";
}

/* Se abre con lo MEJOR para su país, nunca con PayPal. */
function newPay(kind){ payForm(null, kind||railsFor(ME.country)[0]); }
function editPay(id){ const m=MYPAY.find(x=>x.id===id); if(m) payForm(m, m.kind); }

function payForm(m, kind){
  const order=railsFor(ME.country);
  kind = kind || order[0];
  const k=PAY_KINDS[kind]||PAY_KINDS[order[0]];
  const val=f=>{ if(!m) return ""; if(f==="clabe"||f==="iban"||f==="account_number") return ""; return m[f]||""; };
  $("payForm").innerHTML=`<div class="card" style="margin-top:.6rem">
    <div class="field"><label>Método <small style="font-weight:400;color:var(--tinta-60)">— ordenados de más rápido a más lento para ${flagOf(ME.country)} ${esc(countryName(ME.country))}</small></label>
      <select id="pk" onchange="payForm(${m?`MYPAY.find(x=>x.id==='${m.id}')`:"null"}, this.value)">
        ${order.map(v=>{const o=PAY_KINDS[v]; return `<option value="${v}" ${v===kind?"selected":""}>${o.tag?o.tag+" · ":""}${o.label}</option>`;}).join("")}
      </select></div>
    <div class="hint"><b>${esc(k.speed)}</b></div>
    <div class="hint">${k.hint}</div>
    ${kind==="paypal"?`<div class="hint" style="color:#a33">Ojo: si tienes cualquiera de las opciones de arriba, vas a recibir tu dinero <b>mucho antes</b> y con menos comisión.</div>`:``}
    ${k.fields.map(f=>f==="chain"
      ?`<div class="field"><label>${PAY_LBL[f]}</label><select id="pf_${f}">${CHAINS.map(c=>`<option value="${c}" ${val("chain")===c?"selected":""}>${c.toUpperCase()}</option>`).join("")}</select></div>`
      :`<div class="field"><label>${PAY_LBL[f]}${(f==="clabe"||f==="iban"||f==="account_number")&&m?" (vuelve a escribirla)":""}</label><input id="pf_${f}" value="${esc(val(f))}"></div>`).join("")}
    ${kind==="usdc"?`<div class="hint" style="color:#a33">⚠️ Revisa la red y la dirección carácter por carácter. Un envío a la red equivocada NO se puede recuperar.</div>`:``}
    <div class="row2">
      <div class="field"><label>País</label><input id="pf_country" value="${esc(m?.country||"MX")}"></div>
      <div class="field"><label>Moneda en que quieres recibir</label><input id="pf_currency" value="${esc(m?.currency||"MXN")}"></div>
    </div>
    <label style="display:block;margin:.4rem 0"><input type="checkbox" id="pf_default" ${(!MYPAY.length||m?.is_default)?"checked":""}> Usar como método principal</label>
    <div class="acts">
      <button class="btn btn-primary" onclick="savePay('${m?m.id:""}')">Guardar método</button>
      <button class="btn" onclick="document.getElementById('payForm').innerHTML=''">Cancelar</button>
    </div></div>`;
}

async function savePay(id){
  const kind=$("pk").value, p={kind, country:$("pf_country").value.trim()||"MX",
    currency:$("pf_currency").value.trim()||"MXN", is_default:$("pf_default").checked};
  if(id) p.id=id;
  (PAY_KINDS[kind]?.fields||[]).forEach(f=>{ const el=$("pf_"+f); if(el&&el.value.trim()) p[f]=el.value.trim(); });
  try{ const {error}=await sb.rpc("vpa_save_payout_method",{payload:p}); if(error)throw error;
    toast("Método de cobro guardado ✓"); $("payForm").innerHTML=""; RENDER.cobros();
  }catch(e){ toast("Error: "+e.message); }
}
async function setDefaultPay(id){
  try{ const {error}=await sb.rpc("vpa_set_default_payout_method",{p_id:id}); if(error)throw error;
    toast("Listo ✓"); RENDER.cobros(); }catch(e){ toast("Error: "+e.message); }
}
async function delPay(id){
  if(!confirm("¿Eliminar este método de cobro?")) return;
  try{ const {error}=await sb.rpc("vpa_delete_payout_method",{p_id:id}); if(error)throw error;
    toast("Eliminado"); RENDER.cobros(); }catch(e){ toast("Error: "+e.message); }
}

/* ============ MEMBRESÍA ============ */
RENDER.membresia=async ()=>{
  const sub=ME.subscription; const cur=sub?sub.plan_id:"free";
  const pts=ME.points||0, credits=ME.credits_cents||0;
  // acuerdo de reparto vigente o propuesto
  const { data:deals } = await sb.from("app_vpa_deals").select("*").order("created_at",{ascending:false}).limit(5);
  const proposed=(deals||[]).find(d=>d.status==="proposed");
  const agreed=(deals||[]).find(d=>d.status==="agreed");
  $("main").innerHTML=`<div class="sec-head"><h2>Membresía y acuerdo</h2></div>
    <div class="hint">Tu plan define tu exposición y tus créditos de marketing. Tu <b>acuerdo de reparto</b> define qué % de cada venta conservas. Para cambiar de plan, escríbele a Voces.</div>
    ${proposed?`<div class="card unread">
      <h4>Voces te propone un acuerdo de reparto</h4>
      <div class="meta" style="margin-top:3px;color:var(--tinta)">Conservas el <b>${proposed.specialist_pct}%</b> de cada venta; el resto es para Voces por la exposición y las conexiones.${proposed.note?" — "+esc(proposed.note):""}</div>
      <div class="acts"><button class="btn btn-primary btn-sm" onclick="respondDeal('accept')">Aceptar acuerdo</button>
        <button class="btn btn-ghost btn-sm" onclick="respondDeal('decline')">Rechazar</button></div></div>`:""}
    ${agreed?`<div class="card"><h4>Tu acuerdo vigente <span class="pill published">activo</span></h4>
      <div class="meta">Conservas el <b>${agreed.specialist_pct}%</b> de cada venta. Se aplica automáticamente en cada compra.</div></div>`:
      `<div class="card"><div class="meta">Sin acuerdo personalizado: aplica el reparto por defecto de tu plan.</div></div>`}
    ${COMM?`<div class="card" style="display:block">
      <h4>Comisión de Voces <span class="pill ${COMM.accepted?"published":"pending"}">${COMM.commission_pct}%</span></h4>
      <div class="meta" style="margin-top:6px;color:var(--tinta);line-height:1.55">${commissionText(COMM.commission_pct)}</div>
      ${COMM.accepted
        ? `<div class="meta" style="margin-top:9px;color:#4c7a4c;font-weight:600">✓ Aceptada el ${new Date(COMM.accepted_at).toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}</div>`
        : `<label class="chk" style="display:flex;gap:9px;align-items:flex-start;margin-top:11px;font-weight:600">
             <input type="checkbox" id="memCommOk" style="margin-top:3px">
             <span>Entiendo y acepto la comisión del ${COMM.commission_pct}% aplicable a mi cuenta.</span></label>
           <div class="acts"><button class="btn btn-primary btn-sm" onclick="acceptCommissionFromMembership()">Aceptar comisión</button></div>`}
    </div>`:""}
    <div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      <div><div class="meta">Tu plan actual</div><h3 style="font-size:22px">${esc((PLANS.find(p=>p.id===cur)||{}).name_es||cur)}</h3>
        ${sub?`<div class="meta">${esc(sub.status)} · ${esc(sub.period||"")}</div>`:`<div class="meta">Gratis</div>`}</div>
      <div style="margin-left:auto;text-align:right"><div class="meta">Voces Points</div><h3 style="font-size:22px">${pts}</h3></div>
      <div style="text-align:right"><div class="meta">Créditos de marketing</div><h3 style="font-size:22px">${usd(credits)}</h3></div>
    </div>
    <div class="row2" style="grid-template-columns:1fr 1fr;gap:12px">
      ${PLANS.map(p=>`<div class="card ${p.id===cur?"unread":""}">
        <h4>${esc(p.name_es)} ${p.id===cur?'<span class="pill published">actual</span>':''}</h4>
        <div class="meta">${p.monthly_cents?usd(p.monthly_cents)+"/mes · "+usd(p.yearly_cents)+"/año":"Gratis"}</div>
        <div class="meta" style="margin-top:4px;color:var(--tinta)"><b>${p.commission_pct}%</b> de comisión en tus ventas</div>
        <ul style="margin:8px 0 0 16px;font-size:12.5px;color:var(--tinta-60)">${(p.perks_es||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div>`).join("")}
    </div>`;
};
async function acceptCommissionFromMembership(){
  const chk=document.getElementById("memCommOk");
  if(!chk||!chk.checked){ toast("Marca la casilla para confirmar que aceptas la comisión"); return; }
  try{ const {error}=await sb.rpc("vpa_accept_commission",{ p_pct:COMM.commission_pct, p_source:"membresia" });
    if(error) throw error; await loadCommission(); toast("Comisión aceptada ✓"); RENDER.membresia();
  }catch(e){ toast("Error: "+e.message); }
}
async function respondDeal(action){
  try{ const {error}=await sb.rpc("vpa_deal_respond",{p_action:action}); if(error)throw error;
    toast(action==="accept"?"Acuerdo aceptado ✓":"Acuerdo rechazado");
    const {data}=await sb.rpc("vpa_my_profile"); if(data) ME=data; RENDER.membresia(); }catch(e){ toast("Error: "+e.message); }
}

/* ============ REFIERE Y GANA ============ */
RENDER.referir=async ()=>{
  $("main").innerHTML=`<div class="sec-head"><h2>Refiere y gana</h2></div>
    <div class="hint">Comparte tu enlace personal. Cuando alguien se registra y activa su membresía con él, sumas Voces Points y queda ligado a ti. (Los descuentos son aparte: los activa Voces con códigos propios.)</div>
    <div id="refBody"><div class="card"><div class="meta">Cargando tu enlace…</div></div></div>`;
  const { data, error } = await sb.rpc("vpa_my_referral_code");
  if(error || !data || !data.ok){ $("refBody").innerHTML=`<div class="card"><div class="meta">No se pudo cargar tu enlace${error?": "+esc(error.message):""}.</div></div>`; return; }
  const link = location.origin + "/crear-perfil?ref=" + data.code;
  window.__refLink=link;
  const wa = "https://wa.me/?text=" + encodeURIComponent("Súmate a Voces para el Alma con mi enlace: " + link);
  $("refBody").innerHTML=`
    <div class="card" style="display:block">
      <div class="meta">Tu código</div>
      <h3 style="font-size:22px;letter-spacing:.03em">${esc(data.code)}</h3>
      <div class="field" style="margin-top:12px"><label>Tu enlace de referido</label>
        <input id="refLink" readonly value="${esc(link)}" onclick="this.select()"></div>
      <div class="acts">
        <button class="btn btn-primary btn-sm" onclick="copyRefLink()">Copiar enlace</button>
        <a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${wa}">Compartir por WhatsApp</a>
      </div>
    </div>
    <div class="card" style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">
      <div><div class="meta">Referidos</div><h3 style="font-size:22px">${data.referrals||0}</h3></div>
      <div><div class="meta">Usos del enlace</div><h3 style="font-size:22px">${data.uses||0}</h3></div>
      <div style="margin-left:auto;text-align:right"><div class="meta">Puntos por referido</div><h3 style="font-size:22px">+${data.points_per_use||0}</h3></div>
    </div>`;
};
function copyRefLink(){
  const l=window.__refLink||"";
  try{ navigator.clipboard.writeText(l); toast("Enlace copiado ✓"); }
  catch(_){ const i=$("refLink"); if(i){ i.select(); try{document.execCommand("copy");}catch(e){} } toast("Enlace copiado ✓"); }
}

/* ============ INIT ============ */
(async function(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session && !claimToken){ boot(); } else { $("gate").style.display="flex"; initGate(); }
})();
</script>
