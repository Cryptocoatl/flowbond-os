name = "kai-room"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# The party server for Kai World co-op: one Durable Object per room code holds
# the members, the shared mission state, and relays WebRTC signalling for the
# in-game voice call. No secrets, no database — the room is ephemeral.

[[durable_objects.bindings]]
name = "ROOM"
class_name = "KaiRoom"

# SQLite-backed DO classes are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["KaiRoom"]

[vars]
# Comma-separated origin allow-list for the WebSocket upgrade + HTTP probes.
ALLOWED_ORIGINS = "https://play.flowbond.life,https://kai.flowbond.life,http://localhost:3070,http://localhost:8787"
