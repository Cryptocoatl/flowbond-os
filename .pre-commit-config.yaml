# FlowBond pre-commit hooks — FG-042
# Setup: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
        # Runs on every commit; catches secrets before they hit the remote.
        # CI equivalent: gitleaks detect --source . --config .gitleaks.toml
